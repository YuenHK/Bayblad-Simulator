name: Authorize application rollback
on:
  workflow_dispatch:
    inputs:
      previous_run_id: { description: "Trusted release workflow run id", required: true, type: string }
      previous_artifact: { description: "Previous release artifact name", required: true, type: string }
      previous_manifest_sha256: { description: "Previous manifest SHA-256", required: true, type: string }
      previous_commit: { description: "Previous 40-character commit", required: true, type: string }
      current_run_id: { description: "Trusted release workflow run id", required: true, type: string }
      current_artifact: { description: "Current release artifact name", required: true, type: string }
      current_manifest_sha256: { description: "Current manifest SHA-256", required: true, type: string }
      current_commit: { description: "Current 40-character commit", required: true, type: string }
permissions:
  contents: read
jobs:
  authorize:
    environment: production-rollback-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read, actions: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Validate immutable operator inputs
        env:
          PREVIOUS_RUN: ${{ inputs.previous_run_id }}
          CURRENT_RUN: ${{ inputs.current_run_id }}
          PREVIOUS_ARTIFACT: ${{ inputs.previous_artifact }}
          CURRENT_ARTIFACT: ${{ inputs.current_artifact }}
          PREVIOUS_SHA: ${{ inputs.previous_manifest_sha256 }}
          CURRENT_SHA: ${{ inputs.current_manifest_sha256 }}
          PREVIOUS_COMMIT: ${{ inputs.previous_commit }}
          CURRENT_COMMIT: ${{ inputs.current_commit }}
        run: node scripts/validate-rollback-inputs.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "${{ inputs.previous_artifact }}", run-id: "${{ inputs.previous_run_id }}", github-token: "${{ github.token }}", path: sources/previous }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "${{ inputs.current_artifact }}", run-id: "${{ inputs.current_run_id }}", github-token: "${{ github.token }}", path: sources/current }
      - name: Verify both source subjects and rebuild the mixed manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(./scripts/portable-sha256.sh digest sources/previous/release-manifest.json)" = '${{ inputs.previous_manifest_sha256 }}'
          test "$(./scripts/portable-sha256.sh digest sources/current/release-manifest.json)" = '${{ inputs.current_manifest_sha256 }}'
          gh attestation verify sources/previous/release-manifest.json --repo "$GITHUB_REPOSITORY"
          gh attestation verify sources/current/release-manifest.json --repo "$GITHUB_REPOSITORY"
          mkdir -p release
          node scripts/create-authorized-rollback.mjs sources/previous/release-manifest.json sources/current/release-manifest.json '${{ inputs.previous_commit }}' '${{ inputs.current_commit }}' release/release-manifest.json
          ./scripts/portable-sha256.sh manifest release release-manifest.json > release/SHA256SUMS
          ./scripts/portable-sha256.sh digest release/release-manifest.json | tee release/EXTERNAL-MANIFEST-SHA256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: release/release-manifest.json }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "authorized-rollback-${{ inputs.previous_commit }}", path: release/, if-no-files-found: error, retention-days: 90 }
