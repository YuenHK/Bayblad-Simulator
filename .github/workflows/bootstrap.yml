name: Protected production host bootstrap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/bootstrap/**
      - scripts/verify-environment-protection.mjs
      - .github/workflows/bootstrap.yml
permissions: { contents: read }
jobs:
  publish-bootstrap:
    environment: bootstrap-release-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Require protected default branch
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          node scripts/verify-environment-protection.mjs "$GITHUB_REPOSITORY" bootstrap-release-approval
      - run: infra/bootstrap/create-package.sh infra/bootstrap bootstrap.tgz
      - name: Match the externally rotated digest and sign the package
        env:
          EXPECTED_BOOTSTRAP_ARCHIVE_SHA256: "${{ vars.EXPECTED_BOOTSTRAP_ARCHIVE_SHA256 }}"
          BOOTSTRAP_SIGNING_KEY: "${{ secrets.BOOTSTRAP_SIGNING_KEY }}"
        run: |
          set -euo pipefail
          actual=$(sha256sum bootstrap.tgz | awk '{print $1}')
          test "$actual" = "$EXPECTED_BOOTSTRAP_ARCHIVE_SHA256"
          printf '%s\n' "$actual" > BOOTSTRAP-ARCHIVE-SHA256
          umask 077
          printf '%s\n' "$BOOTSTRAP_SIGNING_KEY" > "$RUNNER_TEMP/bootstrap-signing-key"
          ssh-keygen -Y sign -q -f "$RUNNER_TEMP/bootstrap-signing-key" -n steam-top-bootstrap-source bootstrap.tgz
          rm -f "$RUNNER_TEMP/bootstrap-signing-key"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: bootstrap.tgz }
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: infra/bootstrap/install-bootstrap.sh }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "production-bootstrap-${{ github.sha }}"
          path: |
            bootstrap.tgz
            bootstrap.tgz.sig
            BOOTSTRAP-ARCHIVE-SHA256
            infra/bootstrap/install-bootstrap.sh
          if-no-files-found: error
          retention-days: 90
