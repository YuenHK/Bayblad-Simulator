name: Deploy and record protected production release
on:
  workflow_dispatch:
    inputs:
      release_run_id: { required: true, type: string }
      artifact: { required: true, type: string }
      manifest_sha256: { required: true, type: string }
      commit: { required: true, type: string }
      signer_kind: { required: true, type: choice, options: [normal, rollback] }
permissions: { contents: read }
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy-record:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: read, actions: read, deployments: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Validate immutable dispatch inputs and production protection
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_RUN: "${{ inputs.release_run_id }}"
          RELEASE_ARTIFACT: "${{ inputs.artifact }}"
          MANIFEST_SHA: "${{ inputs.manifest_sha256 }}"
          RELEASE_COMMIT: "${{ inputs.commit }}"
          SIGNER_KIND: "${{ inputs.signer_kind }}"
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN" =~ ^[1-9][0-9]{0,19}$ && "$RELEASE_ARTIFACT" =~ ^(approved-release-[a-f0-9]{40}|authorized-rollback-[a-f0-9]{40}-[a-f0-9]{40}-[0-9]+)$ && "$MANIFEST_SHA" =~ ^[a-f0-9]{64}$ && "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ && "$SIGNER_KIND" =~ ^(normal|rollback)$ ]]
          [[ "$SIGNER_KIND" == normal && "$RELEASE_ARTIFACT" == approved-release-* || "$SIGNER_KIND" == rollback && "$RELEASE_ARTIFACT" == authorized-rollback-* ]]
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch);[[ "$GITHUB_REF" == "refs/heads/$default_branch" ]]
          node scripts/verify-rollback-go-live.mjs "$GITHUB_REPOSITORY" production
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > release-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN/artifacts" > release-artifacts.json
          node scripts/verify-run-artifact.mjs release-artifacts.json "$RELEASE_ARTIFACT"
          if [[ "$SIGNER_KIND" == normal ]];then tag=$(node scripts/verify-release-run.mjs release-run.json "$RELEASE_COMMIT");scripts/fetch-github-tag-chain.sh "$GITHUB_REPOSITORY" "$tag" tag-chain.ndjson;node scripts/verify-github-tag-chain.mjs tag-chain.ndjson "$RELEASE_COMMIT";else node -e 'const r=require("./release-run.json");if(r.path!==".github/workflows/authorize-rollback.yml"||r.event!=="workflow_dispatch"||r.conclusion!=="success")process.exit(1)';fi
          node -e 'const r=require("./release-run.json");for(const [k,v] of [["SOURCE_HEAD_SHA",r.head_sha],["SOURCE_REF",r.head_branch],["SOURCE_EVENT",r.event]]){if(typeof v!=="string"||v.includes("\n"))process.exit(1);require("fs").appendFileSync(process.env.GITHUB_ENV,`${k}=${v}\n`)}'
          latest=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=1" --jq 'if length==0 then "none" else (.[0].id|tostring)+"|"+.[0].payload.manifestSha256 end')
          echo "EXPECTED_PRODUCTION_STATE=$latest" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "${{ inputs.artifact }}", run-id: "${{ inputs.release_run_id }}", github-token: "${{ github.token }}", path: release }
      - name: Create nonce-bound protected host authorization
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_RUN: "${{ inputs.release_run_id }}"
          RELEASE_ARTIFACT: "${{ inputs.artifact }}"
          MANIFEST_SHA: "${{ inputs.manifest_sha256 }}"
          RELEASE_COMMIT: "${{ inputs.commit }}"
          SIGNER_KIND: "${{ inputs.signer_kind }}"
        run: |
          set -euo pipefail
          signer="$GITHUB_REPOSITORY/.github/workflows/ci.yml";marker=release/APPROVED-RELEASE.json
          if [[ "$SIGNER_KIND" == rollback ]];then signer="$GITHUB_REPOSITORY/.github/workflows/authorize-rollback.yml";marker=release/ROLLBACK-SOURCES.json;fi
          nonce=$(openssl rand -hex 32);node scripts/create-pending-deployment.mjs release/release-manifest.json "$RELEASE_RUN" "$RELEASE_ARTIFACT" "$MANIFEST_SHA" "$RELEASE_COMMIT" "$nonce" "$SIGNER_KIND" "$signer" "$SOURCE_HEAD_SHA" "$SOURCE_REF" "$SOURCE_EVENT" "$EXPECTED_PRODUCTION_STATE" pending-deployment.json
          deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input pending-deployment.json --jq .id)
          node scripts/create-bootstrap-authorization.mjs pending-deployment.json release/release-manifest.json release/runtime-files.sha256 "$marker" "$GITHUB_REPOSITORY" "$SIGNER_KIND" "$signer" "$deployment_id" deployment-authorization.json
          printf 'DEPLOYMENT_ID=%s\nDEPLOYMENT_NONCE=%s\n' "$deployment_id" "$nonce" >> "$GITHUB_ENV"
          printf '{"state":"in_progress","environment":"production","description":"protected host deployment running"}\n' > in-progress.json;gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --input in-progress.json
      - name: Attest protected deployment authorization from the approved default-branch workflow
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with: { subject-path: deployment-authorization.json }
      - name: Preserve the attested authorization for crash reconciliation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-authorization-${{ env.DEPLOYMENT_ID }}
          path: deployment-authorization.json
          retention-days: 30
      - name: Verify subject, deploy through protected host, and smoke
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_RUN: "${{ inputs.release_run_id }}"
          RELEASE_ARTIFACT: "${{ inputs.artifact }}"
          MANIFEST_SHA: "${{ inputs.manifest_sha256 }}"
          RELEASE_COMMIT: "${{ inputs.commit }}"
          SIGNER_KIND: "${{ inputs.signer_kind }}"
          SSH_HOST: "${{ secrets.SSH_HOST }}"
          SSH_USER: "${{ secrets.SSH_USER }}"
          SSH_HOST_KEY: "${{ secrets.SSH_HOST_KEY }}"
          SSH_PRIVATE_KEY: "${{ secrets.SSH_PRIVATE_KEY }}"
          REMOTE_ENV_FILE: "${{ secrets.REMOTE_ENV_FILE }}"
          REMOTE_RECEIPT_SIGNING_KEY: "${{ secrets.REMOTE_RECEIPT_SIGNING_KEY }}"
          REMOTE_PRODUCTION_STATE_TOKEN_FILE: "${{ secrets.REMOTE_PRODUCTION_STATE_TOKEN_FILE }}"
          REMOTE_AUTHORIZATION_DIR: "${{ secrets.REMOTE_AUTHORIZATION_DIR }}"
          REMOTE_ADMIN_SMOKE_SECRET_FILE: "${{ secrets.REMOTE_ADMIN_SMOKE_SECRET_FILE }}"
          REMOTE_HOST_RECEIPT_OUTBOX_DIR: "${{ secrets.REMOTE_HOST_RECEIPT_OUTBOX_DIR }}"
          REMOTE_PGSERVICEFILE: "${{ secrets.REMOTE_PGSERVICEFILE }}"
          REMOTE_PGPASSFILE: "${{ secrets.REMOTE_PGPASSFILE }}"
          REMOTE_RECEIPT_PGSERVICE: "${{ secrets.REMOTE_RECEIPT_PGSERVICE }}"
          HOST_RECEIPT_ALLOWED_SIGNERS: "${{ secrets.HOST_RECEIPT_ALLOWED_SIGNERS }}"
          DEPLOYMENT_PURPOSE: production
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ && -n "$SSH_HOST_KEY" && -n "$SSH_PRIVATE_KEY" && "$REMOTE_ENV_FILE" =~ ^/[A-Za-z0-9._/-]+$ && "$REMOTE_RECEIPT_SIGNING_KEY" =~ ^/[A-Za-z0-9._/-]+$ && "$REMOTE_PRODUCTION_STATE_TOKEN_FILE" =~ ^/[A-Za-z0-9._/-]+$ && "$REMOTE_AUTHORIZATION_DIR" =~ ^/[A-Za-z0-9._/-]+$ && "$REMOTE_ADMIN_SMOKE_SECRET_FILE" =~ ^/[A-Za-z0-9._/-]+$ && "$REMOTE_HOST_RECEIPT_OUTBOX_DIR" =~ ^/[A-Za-z0-9._/-]+$ && "$REMOTE_PGSERVICEFILE" =~ ^/[A-Za-z0-9._/-]+$ && "$REMOTE_PGPASSFILE" =~ ^/[A-Za-z0-9._/-]+$ && "$REMOTE_RECEIPT_PGSERVICE" =~ ^[A-Za-z0-9._-]+$ && -n "$HOST_RECEIPT_ALLOWED_SIGNERS" ]]
          signer="$GITHUB_REPOSITORY/.github/workflows/ci.yml"; [[ "$SIGNER_KIND" == rollback ]] && signer="$GITHUB_REPOSITORY/.github/workflows/authorize-rollback.yml"
          test "$(./scripts/portable-sha256.sh digest release/release-manifest.json)" = "$MANIFEST_SHA"
          gh attestation verify release/release-manifest.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
          if [[ "$SIGNER_KIND" == normal ]];then gh attestation verify release/APPROVED-RELEASE.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml";node -e 'const a=require("./release/APPROVED-RELEASE.json");if(a.schemaVersion!==1||a.purpose!=="approved-release"||a.commit!==process.env.RELEASE_COMMIT||a.manifestSha256!==process.env.MANIFEST_SHA||!/^\d+$/.test(a.integrationDeploymentId))process.exit(1)';fi
          install -m 700 -d "$HOME/.ssh"; printf '%s\n' "$SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"; printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"
          tar -C release -czf release.tgz .; scp -q release.tgz "$SSH_USER@$SSH_HOST:/tmp/steam-top-release-$GITHUB_RUN_ID.tgz"
          scp -q pending-deployment.json deployment-authorization.json "$SSH_USER@$SSH_HOST:/tmp/"
          ssh "$SSH_USER@$SSH_HOST" "set -eu; d=\$(mktemp -d /tmp/steam-top-release.XXXXXX); trap 'rm -rf \"\$d\" /tmp/steam-top-release-$GITHUB_RUN_ID.tgz /tmp/pending-deployment.json /tmp/deployment-authorization.json' EXIT; tar -xzf /tmp/steam-top-release-$GITHUB_RUN_ID.tgz -C \"\$d\"; sudo /opt/steam-top-bootstrap/deploy-release.sh \"\$d\" /tmp/deployment-authorization.json /tmp/pending-deployment.json '$MANIFEST_SHA' '$GITHUB_REPOSITORY' '$RELEASE_COMMIT' '$DEPLOYMENT_NONCE' '$EXPECTED_PRODUCTION_STATE|$DEPLOYMENT_ID'" > receipt.frame
          node scripts/parse-host-receipt-frame.mjs receipt.frame "$DEPLOYMENT_NONCE" deployment-receipt.json deployment-receipt.json.sig;printf '%s\n' "$HOST_RECEIPT_ALLOWED_SIGNERS" > host-allowed-signers;ssh-keygen -Y verify -q -f host-allowed-signers -I steam-top-production-host -n steam-top-production-deployment -s deployment-receipt.json.sig < deployment-receipt.json
          node -e 'const r=require("./deployment-receipt.json"),d=require("./pending-deployment.json"),u=new URL(r.publicOrigin);if(r.schemaVersion!==4||r.purpose!=="production"||r.nonce!==d.payload.nonce||r.manifestDigest!==d.payload.manifestSha256||r.commit!==d.ref||u.protocol!=="https:"||u.pathname!=="/"||r.smoke?.complete!==true)process.exit(1)'
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with: { subject-path: deployment-receipt.json }
      - name: Advance protected state only after deploy and smoke
        env:
          GH_TOKEN: "${{ github.token }}"
          SSH_HOST: "${{ secrets.SSH_HOST }}"
          SSH_USER: "${{ secrets.SSH_USER }}"
          PROTECTED_STATE_ALLOWED_SIGNERS: "${{ secrets.PROTECTED_STATE_ALLOWED_SIGNERS }}"
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=1" --jq '.[0] | (.id|tostring)+"|"+.payload.nonce+"|"+.payload.manifestSha256')
          expected=$(node -e 'const d=require("./pending-deployment.json");process.stdout.write(`${process.env.DEPLOYMENT_ID}|${d.payload.nonce}|${d.payload.manifestSha256}`)')
          [[ "$latest" == "$expected" ]]
          scp -q deployment-authorization.json "$SSH_USER@$SSH_HOST:/tmp/deployment-authorization-activate.json"
          ssh "$SSH_USER@$SSH_HOST" "set -eu;trap 'rm -f /tmp/deployment-authorization-activate.json' EXIT;sudo /opt/steam-top-bootstrap/activate-production-state.sh /tmp/deployment-authorization-activate.json" > activation.frame
          node scripts/parse-host-receipt-frame.mjs activation.frame "$DEPLOYMENT_NONCE" activation-receipt.json activation-receipt.json.sig
          printf '%s\n' "$PROTECTED_STATE_ALLOWED_SIGNERS" > state-allowed-signers
          ssh-keygen -Y verify -q -f state-allowed-signers -I state -n steam-top-production-activation -s activation-receipt.json.sig < activation-receipt.json
          node -e 'const a=require("./activation-receipt.json");if(a.schemaVersion!==1||a.purpose!=="production-activation-receipt"||a.deploymentId!==process.env.DEPLOYMENT_ID||a.nonce!==process.env.DEPLOYMENT_NONCE||!/^[a-f0-9]{64}$/.test(a.stateDigest))process.exit(1)'
          echo 'ACTIVATION_COMPLETE=true' >> "$GITHUB_ENV"
      - name: Attest protected host activation receipt
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with: { subject-path: activation-receipt.json }
      - name: Publish success only after protected host activation
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=1" --jq '.[0] | (.id|tostring)+"|"+.payload.nonce+"|"+.payload.manifestSha256')
          expected=$(node -e 'const d=require("./pending-deployment.json");process.stdout.write(`${process.env.DEPLOYMENT_ID}|${d.payload.nonce}|${d.payload.manifestSha256}`)')
          [[ "$latest" == "$expected" ]]
          node scripts/create-deployment-status.mjs "$DEPLOYMENT_ID" deployment-status.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --input deployment-status.json
          after=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=1" --jq '.[0] | (.id|tostring)+"|"+.payload.nonce+"|"+.payload.manifestSha256');[[ "$after" == "$expected" ]]
      - name: Mark interrupted or failed deployment
        if: failure() && env.DEPLOYMENT_ID != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          state=failure;description='protected host deployment failed before activation';if [[ ${ACTIVATION_COMPLETE:-} == true ]];then state=error;description='host activated; GitHub status requires protected reconciliation';fi
          printf '{"state":"%s","environment":"production","description":"%s"}\n' "$state" "$description" > failed.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --input failed.json
