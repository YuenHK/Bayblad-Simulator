name: Record protected production deployment
on:
  workflow_dispatch:
    inputs:
      release_run_id: { required: true, type: string }
      artifact: { required: true, type: string }
      manifest_sha256: { required: true, type: string }
      commit: { required: true, type: string }
permissions: { contents: read }
jobs:
  record:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, actions: read, deployments: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "${{ inputs.artifact }}", run-id: "${{ inputs.release_run_id }}", github-token: "${{ github.token }}", path: release }
      - name: Verify deployed subject and record immutable state
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.release_run_id }}" > release-run.json
          node scripts/verify-release-run.mjs release-run.json '${{ inputs.commit }}' >/dev/null
          test "$(./scripts/portable-sha256.sh digest release/release-manifest.json)" = '${{ inputs.manifest_sha256 }}'
          gh attestation verify release/release-manifest.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          node -e 'const m=require("./release/release-manifest.json");if(m.schemaVersion!==1||m.commit!==process.argv[1]||m.images.migration!==m.images.server)process.exit(1)' '${{ inputs.commit }}'
          payload=$(printf '{"schemaVersion":1,"runId":"%s","artifact":"%s","manifestSha256":"%s","commit":"%s"}' '${{ inputs.release_run_id }}' '${{ inputs.artifact }}' '${{ inputs.manifest_sha256 }}' '${{ inputs.commit }}')
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" -f ref='${{ inputs.commit }}' -f environment=production -f required_contexts='[]' -f payload="$payload" --jq .id)
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success -f environment=production
