name: Reconcile production E2E deployment status
on:
  workflow_run:
    workflows: [Authorize release candidate]
    types: [completed]
permissions: { contents: read }
concurrency:
  group: production-deployment-status-authority
  cancel-in-progress: false
jobs:
  terminal-reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency: { group: production-deployment-status-authority, cancel-in-progress: false }
    permissions: { contents: read, actions: read, deployments: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Mark only orphaned matching Deployments terminal error
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_PATH: ${{ github.event.workflow_run.path }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          [[ $SOURCE_RUN_ID =~ ^[1-9][0-9]*$ && $SOURCE_RUN_ATTEMPT =~ ^[1-9][0-9]*$ && $SOURCE_PATH == .github/workflows/authorize-release.yml && $SOURCE_EVENT == workflow_run && $SOURCE_HEAD_SHA =~ ^[a-f0-9]{40}$ ]]
          exact_environment="production-first-deploy-e2e-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT";fallback=false
          for attempt in 1 2 3 4 5 6;do if gh run download "$SOURCE_RUN_ID" -n "production-e2e-source-binding-$SOURCE_RUN_ATTEMPT" -D "$RUNNER_TEMP/source" 2>/dev/null;then break;fi;sleep 5;done
          binding="$RUNNER_TEMP/source/production-e2e-source-binding.json"
          if [[ -f $binding ]];then
            gh attestation verify "$binding" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
            read -r bound_id bound_manifest bound_nonce < <(node - "$binding" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_HEAD_SHA" "$exact_environment" <<'NODE'
          const b=require(process.argv[2]),keys=Object.keys(b).sort(),expected=["authorizationRunAttempt","authorizationRunId","authorizationWorkflowRef","authorizationWorkflowSha","deploymentId","deploymentPurpose","environment","manifestSha256","nonce","purpose","schemaVersion"].sort();if(JSON.stringify(keys)!==JSON.stringify(expected)||b.schemaVersion!==1||b.purpose!=="production-e2e-source-binding"||b.deploymentPurpose!=="production"||b.environment!==process.argv[6]||String(b.authorizationRunId)!==process.argv[3]||String(b.authorizationRunAttempt)!==process.argv[4]||b.authorizationWorkflowSha!==process.argv[5]||!b.authorizationWorkflowRef?.includes('/.github/workflows/ci.yml@refs/heads/')||!/^[1-9][0-9]*$/.test(String(b.deploymentId))||!/^[a-f0-9]{64}$/.test(b.manifestSha256)||!/^[a-f0-9]{64}$/.test(b.nonce))process.exit(1);console.log(b.deploymentId,b.manifestSha256,b.nonce)
          NODE
            )
            gh api "repos/$GITHUB_REPOSITORY/deployments/$bound_id" > "$RUNNER_TEMP/deployment.json"
            node - "$RUNNER_TEMP/deployment.json" "$bound_id" "$bound_manifest" "$bound_nonce" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_HEAD_SHA" "$exact_environment" > "$RUNNER_TEMP/ids" <<'NODE'
          const d=require(process.argv[2]),[id,manifest,nonce,run,attempt,head,environment]=process.argv.slice(3),p=typeof d.payload==="string"?JSON.parse(d.payload):d.payload;if(String(d.id)!==id||d.environment!==environment||p?.schemaVersion!==4||p.purpose!=="production"||String(p.authorizationRunId)!==run||String(p.authorizationRunAttempt)!==attempt||p.authorizationWorkflowSha!==head||!p.authorizationWorkflowRef?.startsWith("refs/heads/")||p.sourceWorkflow!==`${process.env.GITHUB_REPOSITORY}/.github/workflows/ci.yml`||p.sourceEvent!=="push"||p.manifestSha256!==manifest||p.nonce!==nonce||!/^[1-9][0-9]*$/.test(String(p.runId))||!/^[a-f0-9]{40}$/.test(p.commit)||p.commit!==p.sourceHeadSha)process.exit(1);console.log(`${id} ${p.runId} ${p.commit} ${manifest} ${nonce}`)
          NODE
          else
            fallback=true;gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$exact_environment&per_page=2" > "$RUNNER_TEMP/fallback.json"
            node scripts/classify-production-e2e-fallback.mjs candidates "$RUNNER_TEMP/fallback.json" "$exact_environment" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_HEAD_SHA" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/fallback-candidates.json"
            node -e 'for(const id of require(process.argv[1]).matches)console.log(id)' "$RUNNER_TEMP/fallback-candidates.json" > "$RUNNER_TEMP/fallback-ids"
          fi
          desired=error;receipt_id=none;receipt_sha=none
          : > "$RUNNER_TEMP/reconciliation-receipts.jsonl"
          if [[ $fallback == true ]];then
            description="orphaned-run:$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT";mkdir -p "$RUNNER_TEMP/fallback-statuses";: > "$RUNNER_TEMP/fallback-plan"
            unmatched=$(node -e 'console.log(require(process.argv[1]).unmatched.length)' "$RUNNER_TEMP/fallback-candidates.json");candidate_count=$(wc -l < "$RUNNER_TEMP/fallback-ids"|tr -d ' ')
            if (( unmatched > 0 || candidate_count > 1 ));then
              node -e 'const fs=require("fs"),[run,attempt,sha,matches,unmatched]=process.argv.slice(1);fs.appendFileSync(process.env.RUNNER_TEMP+"/reconciliation-receipts.jsonl",JSON.stringify({schemaVersion:1,purpose:"production-e2e-reconciliation",authorizationRunId:run,authorizationRunAttempt:Number(attempt),authorizationWorkflowSha:sha,fallback:true,outcome:"candidate-conflict",matchingCandidates:Number(matches),unmatchedCandidates:Number(unmatched)})+"\n")' "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_HEAD_SHA" "$candidate_count" "$unmatched";exit 1
            fi
            if [[ ! -s $RUNNER_TEMP/fallback-ids ]];then
              node -e 'const fs=require("fs"),[run,attempt,sha]=process.argv.slice(1);fs.appendFileSync(process.env.RUNNER_TEMP+"/reconciliation-receipts.jsonl",JSON.stringify({schemaVersion:1,purpose:"production-e2e-reconciliation",authorizationRunId:run,authorizationRunAttempt:Number(attempt),authorizationWorkflowSha:sha,fallback:true,outcome:"no-deployment",unmatchedCandidates:0})+"\n")' "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_HEAD_SHA";exit 0
            fi
            while read -r id;do gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" > "$RUNNER_TEMP/fallback-statuses/$id.json";done < "$RUNNER_TEMP/fallback-ids"
            node scripts/classify-production-e2e-fallback.mjs statuses "$RUNNER_TEMP/fallback-candidates.json" "$RUNNER_TEMP/fallback-statuses" "$description" "$RUNNER_TEMP/fallback-plan"
            [[ $(node -e 'console.log(require(process.argv[1]).conflicts.length)' "$RUNNER_TEMP/fallback-plan") == 0 ]]||exit 3
            node -e 'require("fs").writeFileSync(process.argv[1],JSON.stringify({state:"error",environment:process.argv[2],description:process.argv[3]})+"\n")' "$RUNNER_TEMP/fallback-error.json" "$exact_environment" "$description"
            node - "$RUNNER_TEMP/fallback-plan" <<'NODE' > "$RUNNER_TEMP/fallback-pending"
          const p=require(process.argv[2]);for(const id of p.pending)console.log(id)
          NODE
            while read -r id;do [[ -n $id ]]||continue;gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" > "$RUNNER_TEMP/fallback-statuses-before.json";node -e 'const s=require(process.argv[1]).flat().filter(x=>["success","failure","error","inactive"].includes(x.state));process.exit(s.length?1:0)' "$RUNNER_TEMP/fallback-statuses-before.json";gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input "$RUNNER_TEMP/fallback-error.json";for poll in 1 2 3 4 5;do gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" > "$RUNNER_TEMP/fallback-statuses-after.json";if node -e 'const s=require(process.argv[1]).flat().filter(x=>["success","failure","error","inactive"].includes(x.state));process.exit(s.length===1&&s[0].state==="error"&&s[0].description===process.argv[2]?0:1)' "$RUNNER_TEMP/fallback-statuses-after.json" "$description";then break;fi;[[ $poll == 5 ]]&&exit 1;sleep 2;done;done < "$RUNNER_TEMP/fallback-pending"
            node -e 'const fs=require("fs"),p=require(process.argv[1]);for(const [outcome,ids] of [["posted-error",p.pending],["already-error",p.idempotent]])for(const deploymentId of ids)fs.appendFileSync(process.env.RUNNER_TEMP+"/reconciliation-receipts.jsonl",JSON.stringify({schemaVersion:1,purpose:"production-e2e-reconciliation",deploymentId,authorizationRunId:process.argv[2],authorizationRunAttempt:Number(process.argv[3]),fallback:true,outcome,desiredTerminal:"error"})+"\n")' "$RUNNER_TEMP/fallback-plan" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT";exit 0
          fi
          if [[ $fallback == false ]];then for attempt in 1 2 3 4 5 6;do if gh run download "$SOURCE_RUN_ID" -n "production-e2e-terminal-$SOURCE_RUN_ATTEMPT" -D "$RUNNER_TEMP/terminal" 2>/dev/null;then break;fi;sleep 5;done;fi
          if [[ $fallback == false && -f $RUNNER_TEMP/terminal/production-e2e-terminal.json ]];then
            gh attestation verify "$RUNNER_TEMP/terminal/production-e2e-terminal.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
            read -r desired receipt_id < <(node - "$RUNNER_TEMP/terminal/production-e2e-terminal.json" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_HEAD_SHA" <<'NODE'
          const r=require(process.argv[2]);if(r.schemaVersion!==1||r.purpose!=="production-e2e-terminal"||!['success','failure'].includes(r.desiredTerminal)||String(r.authorizationRunId)!==process.argv[3]||String(r.authorizationRunAttempt)!==process.argv[4]||r.authorizationWorkflowSha!==process.argv[5]||!r.authorizationWorkflowRef?.includes('/.github/workflows/ci.yml@refs/heads/')||!/^[1-9][0-9]*$/.test(String(r.deploymentId))||!/^[a-f0-9]{64}$/.test(r.manifestSha256)||!/^[a-f0-9]{64}$/.test(r.nonce))process.exit(1);console.log(r.desiredTerminal,r.deploymentId)
          NODE
            )
            receipt_sha=$(sha256sum "$RUNNER_TEMP/terminal/production-e2e-terminal.json"|awk '{print $1}')
          fi
          while read -r id candidate_run candidate_sha manifest_sha nonce;do
            [[ $id =~ ^[1-9][0-9]*$ && $candidate_run =~ ^[1-9][0-9]*$ && $candidate_sha =~ ^[a-f0-9]{40}$ && $manifest_sha =~ ^[a-f0-9]{64}$ && $nonce =~ ^[a-f0-9]{64}$ ]]||exit 1
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run" > "$RUNNER_TEMP/candidate-run.json"
            node - "$RUNNER_TEMP/candidate-run.json" "$candidate_run" "$candidate_sha" <<'NODE'
          const r=require(process.argv[2]);if(String(r.id)!==process.argv[3]||r.path!==".github/workflows/ci.yml"||r.head_sha!==process.argv[4]||r.event!=="push"||r.conclusion!=="success"||!String(r.head_branch).startsWith("v"))process.exit(1)
          NODE
            [[ $receipt_id == none || $receipt_id == "$id" ]]||{ echo 'terminal receipt deployment mismatch' >&2;exit 1;}
            if [[ $receipt_id != none ]];then node - "$RUNNER_TEMP/terminal/production-e2e-terminal.json" "$id" "$manifest_sha" "$nonce" <<'NODE'
          const r=require(process.argv[2]);if(String(r.deploymentId)!==process.argv[3]||r.manifestSha256!==process.argv[4]||r.nonce!==process.argv[5])process.exit(1)
          NODE
            fi
            terminal=error;[[ $desired != success ]]||terminal=success
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" > "$RUNNER_TEMP/statuses.json"
            description="terminal-receipt:$receipt_sha";[[ $receipt_sha != none ]]||description="orphaned-run:$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT"
            if node - "$RUNNER_TEMP/statuses.json" "$terminal" "$description" <<'NODE'
          const s=require(process.argv[2]).flat().filter(x=>["success","failure","error","inactive"].includes(x.state));if(!s.length)process.exit(1);process.exit(s.length===1&&s[0].state===process.argv[3]&&s[0].description===process.argv[4]?0:2)
          NODE
            then node -e 'const fs=require("fs"),[id,run,attempt,state,description]=process.argv.slice(1);fs.appendFileSync(process.env.RUNNER_TEMP+"/reconciliation-receipts.jsonl",JSON.stringify({schemaVersion:1,purpose:"production-e2e-reconciliation",deploymentId:id,authorizationRunId:run,authorizationRunAttempt:Number(attempt),outcome:"already-terminal",desiredTerminal:state,description})+"\n")' "$id" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$terminal" "$description";continue;else code=$?;[[ $code == 1 ]]||{ echo 'terminal conflict requires manual review' >&2;exit "$code";};fi
            node -e 'require("fs").writeFileSync(process.argv[1],JSON.stringify({state:process.argv[2],environment:process.argv[4],description:process.argv[3]})+"\n")' "$RUNNER_TEMP/error.json" "$terminal" "$description" "$exact_environment"
            # Re-read immediately before the only write; workflow_run fires only after the source run ended.
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" > "$RUNNER_TEMP/statuses-before.json"
            node -e 'const s=require(process.argv[1]).flat();process.exit(s.some(x=>["success","failure","error","inactive"].includes(x.state))?1:0)' "$RUNNER_TEMP/statuses-before.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input "$RUNNER_TEMP/error.json"
            conflict=true;for poll in 1 2 3 4 5;do gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" > "$RUNNER_TEMP/statuses-after.json";if node -e 'const s=require(process.argv[1]).flat().filter(x=>["success","failure","error","inactive"].includes(x.state));process.exit(s.length===1&&s[0].state===process.argv[2]&&s[0].description===process.argv[3]?0:1)' "$RUNNER_TEMP/statuses-after.json" "$terminal" "$description";then conflict=false;break;fi;[[ $poll == 5 ]]||sleep 2;done
            node -e 'const fs=require("fs"),[id,run,attempt,candidate,manifest,nonce,workflowSha,workflow,conflict]=process.argv.slice(1);fs.appendFileSync(process.env.RUNNER_TEMP+"/reconciliation-receipts.jsonl",JSON.stringify({schemaVersion:1,purpose:"production-e2e-reconciliation",deploymentId:id,authorizationRunId:run,authorizationRunAttempt:Number(attempt),authorizationWorkflowSha:workflowSha,authorizationWorkflow:workflow,candidateCommit:candidate,manifestSha256:manifest,nonce,observedTerminal:true,conflict:conflict==="true"})+"\n")' "$id" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$candidate_sha" "$manifest_sha" "$nonce" "$SOURCE_HEAD_SHA" "$SOURCE_PATH" "$conflict"
            [[ $conflict == false ]]||{ echo "terminal status conflict requires manual review" >&2;exit 1;}
          done < "$RUNNER_TEMP/ids"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: always()
        with: { subject-path: "${{ runner.temp }}/reconciliation-receipts.jsonl" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: "production-e2e-reconciliation-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}", path: "${{ runner.temp }}/reconciliation-receipts.jsonl", retention-days: 90, if-no-files-found: error }
