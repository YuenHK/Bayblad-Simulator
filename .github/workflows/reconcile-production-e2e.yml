name: Reconcile production E2E deployment status
on:
  workflow_run:
    workflows: [Authorize release candidate]
    types: [completed]
permissions: { contents: read }
concurrency:
  group: production-e2e-status-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
jobs:
  terminal-reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, actions: read, deployments: write }
    steps:
      - name: Mark only orphaned matching Deployments terminal error
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_PATH: ${{ github.event.workflow_run.path }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          [[ $SOURCE_RUN_ID =~ ^[1-9][0-9]*$ && $SOURCE_RUN_ATTEMPT =~ ^[1-9][0-9]*$ && $SOURCE_PATH == .github/workflows/authorize-release.yml ]]
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/deployments?environment=production-first-deploy-e2e&per_page=100" > "$RUNNER_TEMP/deployments.json"
          node - "$RUNNER_TEMP/deployments.json" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" > "$RUNNER_TEMP/ids" <<'NODE'
          const fs=require("fs"),[path,run,attempt]=process.argv.slice(2),rows=JSON.parse(fs.readFileSync(path)).flat();for(const row of rows){const p=typeof row.payload==="string"?JSON.parse(row.payload):row.payload;if(p?.schemaVersion===4&&p.purpose==="production"&&String(p.authorizationRunId)===run&&String(p.authorizationRunAttempt)===attempt)console.log(row.id)}
          NODE
          while read -r id;do
            [[ $id =~ ^[1-9][0-9]*$ ]]||exit 1
            gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" > "$RUNNER_TEMP/statuses.json"
            if node -e 'const s=require(process.argv[1]);process.exit(s.some(x=>["success","failure","error","inactive"].includes(x.state))?0:1)' "$RUNNER_TEMP/statuses.json";then continue;fi
            node -e 'require("fs").writeFileSync(process.argv[1],JSON.stringify({state:"error",environment:"production-first-deploy-e2e",description:`orphaned authorization run ${process.argv[2]} attempt ${process.argv[3]} concluded ${process.argv[4]}`})+"\n")' "$RUNNER_TEMP/error.json" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_CONCLUSION"
            # Re-read immediately before the only write; workflow_run fires only after the source run ended.
            gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq 'map(select(.state=="success" or .state=="failure" or .state=="error" or .state=="inactive"))|length' | grep -qx 0
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input "$RUNNER_TEMP/error.json"
          done < "$RUNNER_TEMP/ids"
