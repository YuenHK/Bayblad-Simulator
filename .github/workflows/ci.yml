name: CI quality and release gates
on: [push, pull_request]
permissions:
  contents: read
env:
  NODE_VERSION: 24.13.0
  PNPM_VERSION: 11.19.0
  NODE_IMAGE_REPOSITORY: node
  NODE_IMAGE_DIGEST: sha256:4660b1ca8b28d6d1906fd644abe34b2ed81d15434d26d845ef0aced307cf4b6f
  POSTGRES_IMAGE_REPOSITORY: postgres
  POSTGRES_IMAGE_DIGEST: sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
  CADDY_IMAGE_REPOSITORY: caddy
  CADDY_IMAGE_DIGEST: sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
        env: { POSTGRES_USER: steam_top_test, POSTGRES_PASSWORD: steam_top_test, POSTGRES_DB: steam_top_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steam_top_test -d steam_top_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://steam_top_test:steam_top_test@127.0.0.1:5432/steam_top_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @steam-top/db test:postgres
      - run: pnpm --filter @steam-top/server test:postgres
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  production-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality
    env:
      PUBLIC_ORIGIN: https://localhost
      SECURITY_HTTP_ORIGIN: http://localhost
      SECURITY_HTTPS_ORIGIN: https://localhost
      SERVER_IMAGE: steam-top-server:ci
      WEB_IMAGE: steam-top-web:ci
      DATABASE_IMAGE: steam-top-db:ci
      POSTGRES_DB: steam_top
      POSTGRES_USER: steam_top
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_URL: postgresql://steam_top:ci-postgres-password@db:5432/steam_top?sslmode=require
      COOKIE_SIGNING_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      ADMIN_USERNAME: admin
      ADMIN_INITIAL_PASSWORD: fwft2026
      ADMIN_CSRF_SECRET: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI
      WEBCLIP_SIGNING_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM
      WEBCLIP_EXCHANGE_KEY: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ
      ANALYTICS_CURSOR_SECRET: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU
      ICLASS_API_BEARER_TOKEN: ci-not-used
      ICLASS_MODE: guest-only-explicit
      POSTGRES_TLS_CERT_PATH: .ci/tls/server.crt
      POSTGRES_TLS_KEY_PATH: .ci/tls/server.key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate reviewed immutable base-image inputs
        run: node scripts/validate-deployment-env.mjs --base-only
        env: { PUBLIC_ORIGIN: "https://localhost" }
      - name: Create ephemeral PostgreSQL TLS material
        run: |
          mkdir -p .ci/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=db -addext subjectAltName=DNS:db -keyout .ci/tls/server.key -out .ci/tls/server.crt
          chmod 600 .ci/tls/server.key
      - run: pnpm validate:caddy
      - run: docker compose -f compose.yaml -f compose.build.yaml build
      - run: docker compose -f compose.yaml -f compose.build.yaml up -d --wait
      - name: Prove untrusted TLS fails, then install the exact Caddy root
        shell: bash
        run: |
          set -euo pipefail
          if curl --noproxy '*' --fail --silent https://localhost/ >/dev/null 2>&1; then echo "TLS unexpectedly trusted before CA installation" >&2; exit 1; fi
          docker compose -f compose.yaml -f compose.build.yaml cp caddy:/data/caddy/pki/authorities/local/root.crt "$GITHUB_WORKSPACE/.ci/caddy-root.crt"
          test -s "$GITHUB_WORKSPACE/.ci/caddy-root.crt"
          curl --noproxy '*' --fail --silent --show-error --cacert "$GITHUB_WORKSPACE/.ci/caddy-root.crt" https://localhost/ >/dev/null
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          sudo cp "$GITHUB_WORKSPACE/.ci/caddy-root.crt" /usr/local/share/ca-certificates/steam-top-ci.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb" 2>/dev/null || true
          certutil -A -d "sql:$HOME/.pki/nssdb" -n steam-top-ci -t "C,," -i "$GITHUB_WORKSPACE/.ci/caddy-root.crt"
          printf 'SECURITY_TLS_CA_FILE=%s\nNODE_EXTRA_CA_CERTS=%s\n' "$GITHUB_WORKSPACE/.ci/caddy-root.crt" "$GITHUB_WORKSPACE/.ci/caddy-root.crt" >> "$GITHUB_ENV"
      - name: Verify strict Node TLS before browser security tests
        run: node -e 'require("https").get(process.env.SECURITY_HTTPS_ORIGIN,res=>{if(res.statusCode!==200)process.exit(1);res.resume()}).on("error",error=>{console.error(error);process.exit(1)})'
      - name: Run complete production HTTPS and WebSocket smoke through loopback
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(printf '6%.0s' {1..64})"
          umask 077
          printf '{"username":"%s","password":"%s"}\n' "$ADMIN_USERNAME" "$ADMIN_INITIAL_PASSWORD" > "$RUNNER_TEMP/admin-smoke.json"
          docker compose -f compose.yaml -f compose.build.yaml exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -v nonce="$nonce" <<'SQL'
          create table if not exists restore_control.deployment_probe(nonce text primary key check(nonce~'^[a-f0-9]{64}$'),restore_target_id uuid not null,system_identifier text not null,created_at timestamptz not null default clock_timestamp(),consumed_at timestamptz);
          insert into restore_control.deployment_probe(nonce,restore_target_id,system_identifier)
          select :'nonce',restore_target_id,(select system_identifier::text from pg_control_system())
          from restore_control.deployment_environment where singleton;
          SQL
          ADMIN_SMOKE_SECRET_FILE="$RUNNER_TEMP/admin-smoke.json" ./scripts/production-smoke.sh "$PUBLIC_ORIGIN" "$nonce"
          rm -f "$RUNNER_TEMP/admin-smoke.json"
      - name: Verify non-root framed receipt export boundary
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(printf '7%.0s' {1..64})"
          sudo install -d -o root -g root -m 0755 /opt/steam-top/scripts
          sudo install -o root -g root -m 0555 scripts/fetch-host-receipt.sh /opt/steam-top/scripts/fetch-host-receipt.sh
          sudo install -d -o root -g root -m 0700 /var/lib/steam-top-receipts
          printf '{"nonce":"%s","smoke":"passed"}\n' "$nonce" | sudo tee "/var/lib/steam-top-receipts/$nonce.json" >/dev/null
          printf 'fixture-signature\n' | sudo tee "/var/lib/steam-top-receipts/$nonce.json.sig" >/dev/null
          sudo chmod 0400 "/var/lib/steam-top-receipts/$nonce.json" "/var/lib/steam-top-receipts/$nonce.json.sig"
          sudo useradd --system --no-create-home steam-top-deploy
          printf 'steam-top-deploy ALL=(root) NOPASSWD: SETENV: /opt/steam-top/scripts/fetch-host-receipt.sh %s\n' "$nonce" | sudo tee /etc/sudoers.d/steam-top-receipt-ci >/dev/null
          sudo chmod 0440 /etc/sudoers.d/steam-top-receipt-ci
          sudo visudo -cf /etc/sudoers.d/steam-top-receipt-ci
          if sudo -u steam-top-deploy test -r "/var/lib/steam-top-receipts/$nonce.json"; then exit 1; fi
          sudo -u steam-top-deploy sudo HOST_RECEIPT_OUTBOX_DIR=/var/lib/steam-top-receipts /opt/steam-top/scripts/fetch-host-receipt.sh "$nonce" > "$RUNNER_TEMP/framed-receipt"
          grep -Fx "RECEIPT-BEGIN $nonce" "$RUNNER_TEMP/framed-receipt"
          grep -Fx 'RECEIPT-SIGNATURE' "$RUNNER_TEMP/framed-receipt"
          grep -Fx "RECEIPT-END $nonce" "$RUNNER_TEMP/framed-receipt"
      - run: pnpm test:security
      - if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml down -v
  release-images:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [quality, production-security]
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Authenticate only for immutable GHCR publication
        shell: bash
        run: printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Build and publish application images with provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/steam-top"
          docker buildx build --provenance=mode=max --sbom=true --push --metadata-file release/server.json --tag "$repository/server:${GITHUB_SHA}" --build-arg NODE_IMAGE_REPOSITORY --build-arg NODE_IMAGE_DIGEST -f Dockerfile.server .
          docker buildx build --provenance=mode=max --sbom=true --push --metadata-file release/web.json --tag "$repository/web:${GITHUB_SHA}" --build-arg NODE_IMAGE_REPOSITORY --build-arg NODE_IMAGE_DIGEST --build-arg CADDY_IMAGE_REPOSITORY --build-arg CADDY_IMAGE_DIGEST -f Dockerfile.web .
          docker buildx build --provenance=mode=max --sbom=true --push --metadata-file release/database.json --tag "$repository/database:${GITHUB_SHA}" --build-arg POSTGRES_IMAGE_REPOSITORY --build-arg POSTGRES_IMAGE_DIGEST -f Dockerfile.db .
          node scripts/create-release-manifest.mjs "$GITHUB_SHA" "$repository" release/server.json release/web.json release/database.json release/release-manifest.json
          node scripts/create-runtime-files-manifest.mjs . release/runtime-files.sha256
          ./scripts/portable-sha256.sh manifest release server.json web.json database.json release-manifest.json runtime-files.sha256 > release/SHA256SUMS
      - name: Attest the release authorization manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/release-manifest.json
      - name: Attest the exact root runtime file manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/runtime-files.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
  release-host-core-integration:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: release-images
    permissions: { contents: read, actions: read, deployments: write, packages: read, id-token: write, attestations: write }
    env:
      DEPLOYMENT_PURPOSE: release-integration
      PUBLIC_ORIGIN: https://steam-top.integration.test:18443
      POSTGRES_DB: steam_top
      POSTGRES_USER: steam_top
      POSTGRES_PASSWORD: integration-postgres-password
      DATABASE_URL: postgresql://steam_top:integration-postgres-password@db:5432/steam_top?sslmode=require
      COOKIE_SIGNING_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      ADMIN_USERNAME: admin
      ADMIN_INITIAL_PASSWORD: integration-admin-password
      ADMIN_CSRF_SECRET: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI
      WEBCLIP_SIGNING_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM
      WEBCLIP_EXCHANGE_KEY: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ
      ANALYTICS_CURSOR_SECRET: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU
      ICLASS_API_BEARER_TOKEN: integration-unused
      ICLASS_MODE: guest-only-explicit
      POSTGRES_TLS_CERT_PATH: /opt/steam-top/.release-integration/tls/server.crt
      POSTGRES_TLS_KEY_PATH: /opt/steam-top/.release-integration/tls/server.key
    steps:
      - name: Require a disposable GitHub-hosted runner
        env: { RUNNER_KIND: "${{ runner.environment }}" }
        run: test "$RUNNER_KIND" = github-hosted
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "release-manifest-${{ github.sha }}", path: candidate }
      - name: Verify externally attested root runtime manifest
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh attestation verify candidate/runtime-files.sha256 --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
      - name: Authenticate to GHCR for immutable candidate pulls
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Install root canonical integration host and private inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o root -g root -m 0755 /opt/steam-top
          sudo cp -a . /opt/steam-top/source
          sudo cp -a /opt/steam-top/source/. /opt/steam-top/
          sudo rm -rf /opt/steam-top/source
          sudo chown -R root:root /opt/steam-top
          sudo find /opt/steam-top -type d -exec chmod go-w {} +
          sudo find /opt/steam-top/scripts /opt/steam-top/infra/backup -type f -name '*.sh' -exec chmod 0555 {} +
          sudo chmod 0555 /opt/steam-top/apps/server/dist/admin/deletion-ledger-cli.js
          sudo chmod 0444 /opt/steam-top/infra/backup/trusted-ledger-cli.sha256
          runtime_manifest_sha=$(./scripts/portable-sha256.sh digest candidate/runtime-files.sha256)
          sudo /opt/steam-top/scripts/seal-runtime-install.sh "$GITHUB_WORKSPACE/candidate/runtime-files.sha256" "$runtime_manifest_sha" "$GITHUB_SHA"
          sudo install -d -o root -g root -m 0700 /opt/steam-top/.release-integration/{authorization,outbox,tls,secrets}
          sudo install -o root -g root -m 0600 /dev/null /var/lock/steam-top-release-integration.lock
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=db -addext subjectAltName=DNS:db -keyout server.key -out server.crt
          sudo install -o root -g root -m 0600 server.key /opt/steam-top/.release-integration/tls/server.key
          sudo install -o root -g root -m 0600 server.crt /opt/steam-top/.release-integration/tls/server.crt
          printf '%s' "$GITHUB_TOKEN" | sudo tee /opt/steam-top/.release-integration/secrets/github-token >/dev/null
          printf '{"username":"admin","password":"integration-admin-password"}\n' | sudo tee /opt/steam-top/.release-integration/secrets/admin-smoke.json >/dev/null
          printf '[target]\nhost=db\nhostaddr=127.0.0.1\nport=15432\ndbname=steam_top\nuser=steam_top\nsslmode=verify-full\nsslrootcert=/opt/steam-top/.release-integration/tls/server.crt\n' | sudo tee /opt/steam-top/.release-integration/secrets/pg-service >/dev/null
          printf 'db:15432:steam_top:steam_top:integration-postgres-password\n' | sudo tee /opt/steam-top/.release-integration/secrets/pg-pass >/dev/null
          sudo chmod 0600 /opt/steam-top/.release-integration/secrets/*
          sudo ssh-keygen -q -t ed25519 -N '' -f /opt/steam-top/.release-integration/secrets/host-signing
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - name: Build canonical environment and seed isolated local CA
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),m=require('./candidate/release-manifest.json');for(const [k,v] of Object.entries({SERVER_IMAGE:m.images.server,WEB_IMAGE:m.images.web,DATABASE_IMAGE:m.images.database,CADDY_IMAGE_REPOSITORY:process.env.CADDY_IMAGE_REPOSITORY,CADDY_IMAGE_DIGEST:process.env.CADDY_IMAGE_DIGEST}))fs.appendFileSync('/tmp/integration-images.env',`${k}=${v}\n`)
          NODE
          set -a;source /tmp/integration-images.env;set +a
          env | grep -E '^(PUBLIC_ORIGIN|SERVER_IMAGE|WEB_IMAGE|DATABASE_IMAGE|CADDY_IMAGE_REPOSITORY|CADDY_IMAGE_DIGEST|POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD|DATABASE_URL|COOKIE_SIGNING_KEY|ADMIN_USERNAME|ADMIN_INITIAL_PASSWORD|ADMIN_CSRF_SECRET|WEBCLIP_SIGNING_KEY|WEBCLIP_EXCHANGE_KEY|ANALYTICS_CURSOR_SECRET|ICLASS_API_BEARER_TOKEN|ICLASS_MODE|POSTGRES_TLS_CERT_PATH|POSTGRES_TLS_KEY_PATH)=' | sudo tee /opt/steam-top/.release-integration/production.env >/dev/null
          sudo chmod 0600 /opt/steam-top/.release-integration/production.env
          sudo docker compose -p steam-top-release-integration --project-directory /opt/steam-top --env-file /opt/steam-top/.release-integration/production.env -f /opt/steam-top/compose.yaml -f /opt/steam-top/compose.release-integration.yaml up -d --wait
          sudo docker compose -p steam-top-release-integration --project-directory /opt/steam-top --env-file /opt/steam-top/.release-integration/production.env -f /opt/steam-top/compose.yaml -f /opt/steam-top/compose.release-integration.yaml cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/integration-root.crt
          sudo cp /tmp/integration-root.crt /usr/local/share/ca-certificates/steam-top-integration.crt
          sudo update-ca-certificates
          sudo docker compose -p steam-top-release-integration --project-directory /opt/steam-top --env-file /opt/steam-top/.release-integration/production.env -f /opt/steam-top/compose.yaml -f /opt/steam-top/compose.release-integration.yaml exec -T db psql -U steam_top -d steam_top -c "set steam_top.configure_restore_target='RESTORE_NONPRODUCTION_DATA';update restore_control.deployment_environment set environment='production',restore_allowed=false where singleton"
          sudo docker compose -p steam-top-release-integration --project-directory /opt/steam-top --env-file /opt/steam-top/.release-integration/production.env -f /opt/steam-top/compose.yaml -f /opt/steam-top/compose.release-integration.yaml down
      - name: Authorize and invoke the complete host core as non-root
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          manifest_sha=$(./scripts/portable-sha256.sh digest candidate/release-manifest.json);nonce=$(openssl rand -hex 32)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=release-host-integration&per_page=1" --jq 'if length==0 then "none" else (.[0].id|tostring)+"|"+.[0].payload.manifestSha256 end')
          DEPLOYMENT_PURPOSE=release-integration node scripts/create-pending-deployment.mjs candidate/release-manifest.json "$GITHUB_RUN_ID" "release-manifest-$GITHUB_SHA" "$manifest_sha" "$GITHUB_SHA" "$nonce" normal "$GITHUB_REPOSITORY/.github/workflows/ci.yml" "$GITHUB_SHA" "$GITHUB_REF" push "$latest" pending.json
          deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input pending.json --jq .id);echo "INTEGRATION_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          sudo DEPLOYMENT_AUTHORIZATION_PURPOSE=release-integration /opt/steam-top/scripts/prepare-deployment-authorization.sh "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/pending.json" "$GITHUB_REPOSITORY" "$deployment_id" /opt/steam-top/.release-integration/secrets/github-token /opt/steam-top/.release-integration/authorization
          sudo useradd --system --no-create-home steam-top-integration
          sudoers_expected=${latest//|/\\|}
          printf 'steam-top-integration ALL=(root) NOPASSWD: SETENV: /opt/steam-top/scripts/host-deploy-and-receipt.sh %s %s %s %s %s %s %s %s\n' "$GITHUB_WORKSPACE/candidate" /opt/steam-top/.release-integration/production.env "$manifest_sha" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$nonce" "$sudoers_expected" "$deployment_id" | sudo tee /etc/sudoers.d/steam-top-integration >/dev/null
          sudo chmod 0440 /etc/sudoers.d/steam-top-integration;sudo visudo -cf /etc/sudoers.d/steam-top-integration
          sudo -u steam-top-integration sudo NODE_EXTRA_CA_CERTS=/tmp/integration-root.crt HOST_RECEIPT_SIGNING_KEY=/opt/steam-top/.release-integration/secrets/host-signing PRODUCTION_AUTHORIZATION_DIR=/opt/steam-top/.release-integration/authorization DEPLOYMENT_AUTHORIZATION_PURPOSE=release-integration ADMIN_SMOKE_SECRET_FILE=/opt/steam-top/.release-integration/secrets/admin-smoke.json HOST_RECEIPT_OUTBOX_DIR=/opt/steam-top/.release-integration/outbox PGSERVICEFILE=/opt/steam-top/.release-integration/secrets/pg-service PGPASSFILE=/opt/steam-top/.release-integration/secrets/pg-pass HOST_RECEIPT_PGSERVICE=target /opt/steam-top/scripts/host-deploy-and-receipt.sh "$GITHUB_WORKSPACE/candidate" /opt/steam-top/.release-integration/production.env "$manifest_sha" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$nonce" "$latest" "$deployment_id" > receipt.frame
          node scripts/parse-host-receipt-frame.mjs receipt.frame "$nonce" receipt.json receipt.sig
          node -e 'const r=require("./receipt.json");if(r.schemaVersion!==4||r.purpose!=="release-integration"||r.smoke?.complete!==true)process.exit(1)'
          test -f "/opt/steam-top/.release-integration/authorization/$nonce.json.consumed"
          printf '{"state":"success","environment":"release-host-integration","description":"isolated host core and full smoke passed"}\n' > integration-success.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --input integration-success.json
          printf '{"schemaVersion":1,"purpose":"approved-release","commit":"%s","manifestSha256":"%s","integrationDeploymentId":"%s"}\n' "$GITHUB_SHA" "$manifest_sha" "$deployment_id" > candidate/APPROVED-RELEASE.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: candidate/APPROVED-RELEASE.json }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "approved-release-${{ github.sha }}", path: candidate/, if-no-files-found: error, retention-days: 90 }
      - if: failure() && env.INTEGRATION_DEPLOYMENT_ID != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: printf '{"state":"failure","environment":"release-host-integration","description":"isolated host core integration failed"}\n' | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$INTEGRATION_DEPLOYMENT_ID/statuses" --input -
      - if: always()
        shell: bash
        run: |
          set +e
          sudo docker compose -p steam-top-release-integration --project-directory /opt/steam-top --env-file /opt/steam-top/.release-integration/production.env -f /opt/steam-top/compose.yaml -f /opt/steam-top/compose.release-integration.yaml down -v --remove-orphans
          docker logout ghcr.io
          sudo rm -f /etc/sudoers.d/steam-top-integration /usr/local/share/ca-certificates/steam-top-integration.crt /tmp/integration-root.crt /tmp/integration-images.env server.key server.crt
          sudo update-ca-certificates
          sudo userdel steam-top-integration
          sudo rm -rf /opt/steam-top
