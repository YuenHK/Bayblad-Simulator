name: CI quality and release gates
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      candidate_run_id: { required: true, type: string }
      candidate_commit: { required: true, type: string }
      candidate_ref: { required: true, type: string }
permissions:
  contents: read
env:
  NODE_VERSION: 24.13.0
  PNPM_VERSION: 11.19.0
  NODE_IMAGE_REPOSITORY: node
  NODE_IMAGE_DIGEST: sha256:4660b1ca8b28d6d1906fd644abe34b2ed81d15434d26d845ef0aced307cf4b6f
  POSTGRES_IMAGE_REPOSITORY: postgres
  POSTGRES_IMAGE_DIGEST: sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
  CADDY_IMAGE_REPOSITORY: caddy
  CADDY_IMAGE_DIGEST: sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
jobs:
  quality:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
        env: { POSTGRES_USER: steam_top_test, POSTGRES_PASSWORD: steam_top_test, POSTGRES_DB: steam_top_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steam_top_test -d steam_top_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://steam_top_test:steam_top_test@127.0.0.1:5432/steam_top_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-deployment-permissions.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @steam-top/db test:postgres
      - run: pnpm --filter @steam-top/server test:postgres
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  production-security:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality
    env:
      PUBLIC_ORIGIN: https://localhost
      SECURITY_HTTP_ORIGIN: http://localhost
      SECURITY_HTTPS_ORIGIN: https://localhost
      SERVER_IMAGE: steam-top-server:ci
      WEB_IMAGE: steam-top-web:ci
      DATABASE_IMAGE: steam-top-db:ci
      POSTGRES_DB: steam_top
      POSTGRES_USER: steam_top
      POSTGRES_PASSWORD: ci-postgres-password
      APP_DATABASE_PASSWORD: ci-app-postgres-password
      APP_DATABASE_URL: postgresql://steam_top_app:ci-app-postgres-password@db:5432/steam_top?sslmode=require
      DATABASE_URL: postgresql://steam_top:ci-postgres-password@db:5432/steam_top?sslmode=require
      COOKIE_SIGNING_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      ADMIN_USERNAME: admin
      ADMIN_INITIAL_PASSWORD: fwft2026
      ADMIN_CSRF_SECRET: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI
      WEBCLIP_SIGNING_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM
      WEBCLIP_EXCHANGE_KEY: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ
      ANALYTICS_CURSOR_SECRET: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU
      ICLASS_API_BEARER_TOKEN: ci-not-used
      ICLASS_MODE: guest-only-explicit
      POSTGRES_TLS_CERT_PATH: .ci/tls/server.crt
      POSTGRES_TLS_KEY_PATH: .ci/tls/server.key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate reviewed immutable base-image inputs
        run: node scripts/validate-deployment-env.mjs --base-only
        env: { PUBLIC_ORIGIN: "https://localhost" }
      - name: Create ephemeral PostgreSQL TLS material
        run: |
          mkdir -p .ci/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=db -addext subjectAltName=DNS:db -keyout .ci/tls/server.key -out .ci/tls/server.crt
          chmod 600 .ci/tls/server.key
      - run: pnpm validate:caddy
      - run: docker compose -f compose.yaml -f compose.build.yaml build
      - name: Start owner migration, provision non-owner app role, then start application
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f compose.yaml -f compose.build.yaml -f compose.canonical-test.yaml -f compose.canonical-app.yaml)
          "${compose[@]}" config --format json > "$RUNNER_TEMP/compose.json"
          node - "$RUNNER_TEMP/compose.json" <<'NODE'
          const c=require(process.argv[2]),s=c.services.server.secrets.map(x=>typeof x==="string"?x:x.source);if(JSON.stringify(s)!==JSON.stringify(["steam_top_app_database_url"])||c.services.server.environment.DATABASE_URL_FILE!=="/run/secrets/steam_top_app_database_url"||!c.services.migration.secrets.some(x=>(typeof x==="string"?x:x.source)==="database_url"))process.exit(1)
          NODE
          "${compose[@]}" up -d --wait db migration
          "${compose[@]}" exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -v app_password="$APP_DATABASE_PASSWORD" < scripts/provision-app-role.sql
          "${compose[@]}" up -d --wait server web caddy
          test "$("${compose[@]}" exec -T server sh -c 'test -f /run/secrets/steam_top_app_database_url && test ! -e /run/secrets/database_url && printf ok')" = ok
      - name: Prove untrusted TLS fails, then install the exact Caddy root
        shell: bash
        run: |
          set -euo pipefail
          if curl --noproxy '*' --fail --silent https://localhost/ >/dev/null 2>&1; then echo "TLS unexpectedly trusted before CA installation" >&2; exit 1; fi
          docker compose -f compose.yaml -f compose.build.yaml cp caddy:/data/caddy/pki/authorities/local/root.crt "$GITHUB_WORKSPACE/.ci/caddy-root.crt"
          test -s "$GITHUB_WORKSPACE/.ci/caddy-root.crt"
          curl --noproxy '*' --fail --silent --show-error --cacert "$GITHUB_WORKSPACE/.ci/caddy-root.crt" https://localhost/ >/dev/null
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          sudo cp "$GITHUB_WORKSPACE/.ci/caddy-root.crt" /usr/local/share/ca-certificates/steam-top-ci.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb" 2>/dev/null || true
          certutil -A -d "sql:$HOME/.pki/nssdb" -n steam-top-ci -t "C,," -i "$GITHUB_WORKSPACE/.ci/caddy-root.crt"
          printf 'SECURITY_TLS_CA_FILE=%s\nNODE_EXTRA_CA_CERTS=%s\n' "$GITHUB_WORKSPACE/.ci/caddy-root.crt" "$GITHUB_WORKSPACE/.ci/caddy-root.crt" >> "$GITHUB_ENV"
      - name: Install packaged canonical functional fixture
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/install-canonical-ci-fixture.sh > "$RUNNER_TEMP/canonical-fixture.env"
          cat "$RUNNER_TEMP/canonical-fixture.env" >> "$GITHUB_ENV"
      - name: Run activate, promote, public probe, record and finalize through canonical wrappers
        shell: bash
        env:
          TEST_DATABASE_URL: postgresql://steam_top:ci-postgres-password@127.0.0.1:15432/steam_top
          CANONICAL_EXISTING_DATABASE: steam_top
          CANONICAL_PUBLIC_ORIGIN: https://localhost
          CANONICAL_ADMIN_SMOKE_SECRET_FILE: ${{ runner.temp }}/admin-smoke.json
        run: |
          set -euo pipefail
          umask 077
          printf '{"username":"%s","password":"%s"}\n' "$ADMIN_USERNAME" "$ADMIN_INITIAL_PASSWORD" > "$CANONICAL_ADMIN_SMOKE_SECRET_FILE"
          ./infra/backup/test-canonical-cutover-full.sh
          docker compose -f compose.yaml -f compose.build.yaml -f compose.canonical-test.yaml -f compose.canonical-app.yaml up -d --force-recreate --wait server
          sudo rm -f "$CANONICAL_ADMIN_SMOKE_SECRET_FILE"
      - name: Verify strict Node TLS before browser security tests
        run: node -e 'require("https").get(process.env.SECURITY_HTTPS_ORIGIN,res=>{if(res.statusCode!==200)process.exit(1);res.resume()}).on("error",error=>{console.error(error);process.exit(1)})'
      - name: Run complete production HTTPS and WebSocket smoke through loopback
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(printf '6%.0s' {1..64})"
          umask 077
          printf '{"username":"%s","password":"%s"}\n' "$ADMIN_USERNAME" "$ADMIN_INITIAL_PASSWORD" > "$RUNNER_TEMP/admin-smoke.json"
          docker compose -f compose.yaml -f compose.build.yaml exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -v nonce="$nonce" <<'SQL'
          create table if not exists restore_control.deployment_probe(nonce text primary key check(nonce~'^[a-f0-9]{64}$'),restore_target_id uuid not null,system_identifier text not null,created_at timestamptz not null default clock_timestamp(),consumed_at timestamptz);
          alter table restore_control.deployment_probe add column if not exists state text not null default 'pending';alter table restore_control.deployment_probe add column if not exists observed_at timestamptz;alter table restore_control.deployment_probe add column if not exists receipt_signed_at timestamptz;
          insert into restore_control.deployment_probe(nonce,restore_target_id,system_identifier,state)
          select :'nonce',restore_target_id,(select system_identifier::text from pg_control_system()),'pending'
          from restore_control.deployment_environment where singleton;
          SQL
          ADMIN_SMOKE_SECRET_FILE="$RUNNER_TEMP/admin-smoke.json" ./scripts/production-smoke.sh "$PUBLIC_ORIGIN" "$nonce"
          rm -f "$RUNNER_TEMP/admin-smoke.json"
      - name: Verify non-root framed receipt export boundary
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(printf '7%.0s' {1..64})"
          sudo install -d -o root -g root -m 0755 /opt/steam-top/scripts
          sudo install -o root -g root -m 0555 scripts/fetch-host-receipt.sh /opt/steam-top/scripts/fetch-host-receipt.sh
          sudo install -d -o root -g root -m 0700 /var/lib/steam-top-receipts
          printf '{"nonce":"%s","smoke":"passed"}\n' "$nonce" | sudo tee "/var/lib/steam-top-receipts/$nonce.json" >/dev/null
          printf 'fixture-signature\n' | sudo tee "/var/lib/steam-top-receipts/$nonce.json.sig" >/dev/null
          sudo chmod 0400 "/var/lib/steam-top-receipts/$nonce.json" "/var/lib/steam-top-receipts/$nonce.json.sig"
          sudo useradd --system --no-create-home steam-top-deploy
          printf 'steam-top-deploy ALL=(root) NOPASSWD: SETENV: /opt/steam-top/scripts/fetch-host-receipt.sh %s\n' "$nonce" | sudo tee /etc/sudoers.d/steam-top-receipt-ci >/dev/null
          sudo chmod 0440 /etc/sudoers.d/steam-top-receipt-ci
          sudo visudo -cf /etc/sudoers.d/steam-top-receipt-ci
          if sudo -u steam-top-deploy test -r "/var/lib/steam-top-receipts/$nonce.json"; then exit 1; fi
          sudo -u steam-top-deploy sudo HOST_RECEIPT_OUTBOX_DIR=/var/lib/steam-top-receipts /opt/steam-top/scripts/fetch-host-receipt.sh "$nonce" > "$RUNNER_TEMP/framed-receipt"
          grep -Fx "RECEIPT-BEGIN $nonce" "$RUNNER_TEMP/framed-receipt"
          grep -Fx 'RECEIPT-SIGNATURE' "$RUNNER_TEMP/framed-receipt"
          grep -Fx "RECEIPT-END $nonce" "$RUNNER_TEMP/framed-receipt"
      - run: pnpm test:security
      - if: always()
        run: |
          failures="";docker compose -f compose.yaml -f compose.build.yaml down -v || failures="${failures} production-security-compose"
          if [[ -n "$failures" ]];then echo "cleanup failures:$failures" >&2;exit 1;fi

  production-first-deploy-e2e:
    if: github.event_name == 'workflow_call'
    needs: release-host-core-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production-first-deploy-e2e
    concurrency: { group: production-deployment-status-authority, cancel-in-progress: false }
    permissions: { contents: read, actions: read, deployments: write, packages: read, id-token: write, attestations: write }
    env:
      RELEASE_COMMIT: "${{ inputs.candidate_commit }}"
      RELEASE_RUN_ID: "${{ inputs.candidate_run_id }}"
      RELEASE_REF: "${{ inputs.candidate_ref }}"
      BOOTSTRAP_RUN_ID: "${{ vars.BOOTSTRAP_RUN_ID }}"
      BOOTSTRAP_COMMIT: "${{ vars.BOOTSTRAP_COMMIT }}"
      BOOTSTRAP_ARCHIVE_SHA256: "${{ vars.BOOTSTRAP_ARCHIVE_SHA256 }}"
      AUTHORIZATION_WORKFLOW_SHA: "${{ github.workflow_sha }}"
      AUTHORIZATION_WORKFLOW_REF: "${{ github.workflow_ref }}"
      DEPLOYMENT_ENVIRONMENT: "production-first-deploy-e2e-${{ github.run_id }}-${{ github.run_attempt }}"
      PUBLIC_ORIGIN: https://steam-top.production-e2e.test
      POSTGRES_DB: steam_top
      POSTGRES_USER: steam_top
      POSTGRES_PASSWORD: production-e2e-postgres-password
      DATABASE_URL: postgresql://steam_top:production-e2e-postgres-password@db:5432/steam_top?sslmode=require
      APP_DATABASE_PASSWORD: production-e2e-app-password
      APP_DATABASE_URL: postgresql://steam_top_app:production-e2e-app-password@db:5432/steam_top?sslmode=require
      COOKIE_SIGNING_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      ADMIN_USERNAME: admin
      ADMIN_INITIAL_PASSWORD: production-e2e-admin-password
      ADMIN_CSRF_SECRET: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI
      WEBCLIP_SIGNING_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM
      WEBCLIP_EXCHANGE_KEY: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ
      ANALYTICS_CURSOR_SECRET: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU
      ICLASS_API_BEARER_TOKEN: production-e2e-unused
      ICLASS_MODE: guest-only-explicit
      POSTGRES_TLS_CERT_PATH: /run/steam-top-production-e2e/server.crt
      POSTGRES_TLS_KEY_PATH: /run/steam-top-production-e2e/server.key
    steps:
      - name: Require a disposable GitHub-hosted runner
        env: { RUNNER_KIND: "${{ runner.environment }}" }
        run: test "$RUNNER_KIND" = github-hosted
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "approved-release-${{ inputs.candidate_commit }}", path: candidate }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "production-bootstrap-${{ vars.BOOTSTRAP_COMMIT }}", run-id: "${{ vars.BOOTSTRAP_RUN_ID }}", github-token: "${{ github.token }}", path: bootstrap }
      - name: Create and persist the production Deployment source binding
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          manifest_sha=$(./scripts/portable-sha256.sh digest candidate/release-manifest.json);nonce=$(openssl rand -hex 32);source_ref=${AUTHORIZATION_WORKFLOW_REF##*@};[[ $source_ref == refs/heads/* ]]
          gh attestation verify candidate/APPROVED-RELEASE.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          DEPLOYMENT_PURPOSE=production node scripts/create-pending-deployment.mjs candidate/release-manifest.json "$RELEASE_RUN_ID" "approved-release-$RELEASE_COMMIT" "$manifest_sha" "$RELEASE_COMMIT" "$nonce" normal "$GITHUB_REPOSITORY/.github/workflows/ci.yml" "$RELEASE_COMMIT" "$RELEASE_REF" push none pending-production.json
          deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input pending-production.json --jq .id)
          printf 'PRODUCTION_E2E_DEPLOYMENT_ID=%s\nPRODUCTION_E2E_NONCE=%s\nPRODUCTION_E2E_MANIFEST_SHA=%s\n' "$deployment_id" "$nonce" "$manifest_sha" >> "$GITHUB_ENV"
          node - "$RUNNER_TEMP/production-e2e-source-binding.json" "$deployment_id" "$manifest_sha" "$nonce" <<'NODE'
          const fs=require("fs"),[out,deploymentId,manifestSha256,nonce]=process.argv.slice(2);if(!/^[1-9][0-9]*$/.test(deploymentId)||!/^[a-f0-9]{64}$/.test(manifestSha256)||!/^[a-f0-9]{64}$/.test(nonce)||!/^production-first-deploy-e2e-[1-9][0-9]*-[1-9][0-9]*$/.test(process.env.DEPLOYMENT_ENVIRONMENT))process.exit(1);fs.writeFileSync(out,JSON.stringify({schemaVersion:1,purpose:"production-e2e-source-binding",deploymentId,authorizationRunId:process.env.GITHUB_RUN_ID,authorizationRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),authorizationWorkflowRef:process.env.GITHUB_WORKFLOW_REF,authorizationWorkflowSha:process.env.GITHUB_WORKFLOW_SHA,environment:process.env.DEPLOYMENT_ENVIRONMENT,deploymentPurpose:"production",manifestSha256,nonce})+"\n",{mode:0o600})
          NODE
      - name: Attest the immutable production E2E source binding
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: "${{ runner.temp }}/production-e2e-source-binding.json" }
      - name: Upload the immutable production E2E source binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "production-e2e-source-binding-${{ github.run_attempt }}", path: "${{ runner.temp }}/production-e2e-source-binding.json", retention-days: 90, if-no-files-found: error }
      - name: Create the production-purpose authorization
        run: |
          set -euo pipefail
          node scripts/create-bootstrap-authorization.mjs pending-production.json candidate/release-manifest.json candidate/runtime-files.sha256 candidate/APPROVED-RELEASE.json "$GITHUB_REPOSITORY" normal "$GITHUB_REPOSITORY/.github/workflows/ci.yml" "$PRODUCTION_E2E_DEPLOYMENT_ID" production-authorization.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: production-authorization.json }
      - name: Install the production bootstrap and sealed runtime
        env:
          GH_TOKEN: "${{ github.token }}"
          BOOTSTRAP_ALLOWED_SIGNERS: "${{ secrets.BOOTSTRAP_ALLOWED_SIGNERS }}"
          INSTALLER_URL: "${{ vars.INSTALLER_URL }}"
          INSTALLER_SIGNATURE_URL: "${{ vars.INSTALLER_SIGNATURE_URL }}"
          INSTALLER_SHA256: "${{ vars.INSTALLER_SHA256 }}"
          VALIDATOR_URL: "${{ vars.VALIDATOR_URL }}"
          VALIDATOR_SIGNATURE_URL: "${{ vars.VALIDATOR_SIGNATURE_URL }}"
          VALIDATOR_SHA256: "${{ vars.VALIDATOR_SHA256 }}"
          INSTALLER_ALLOWED_HOSTS: "${{ vars.INSTALLER_ALLOWED_HOSTS }}"
          INSTALLER_ALLOWED_SIGNERS: "${{ secrets.INSTALLER_ALLOWED_SIGNERS }}"
        run: |
          set -euo pipefail
          source_ref=${AUTHORIZATION_WORKFLOW_REF##*@};[[ $source_ref == refs/heads/* ]]
          test "$(sha256sum bootstrap/bootstrap.tgz|awk '{print $1}')" = "$BOOTSTRAP_ARCHIVE_SHA256"
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch);default_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$default_branch" --jq .sha)
          test "$default_sha" = "$BOOTSTRAP_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOOTSTRAP_RUN_ID" > "$RUNNER_TEMP/bootstrap-run.json"
          node scripts/verify-bootstrap-source-run.mjs "$RUNNER_TEMP/bootstrap-run.json" "$BOOTSTRAP_RUN_ID" "$BOOTSTRAP_COMMIT" "$default_branch"
          gh attestation verify bootstrap/bootstrap.tgz --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/bootstrap.yml" --format json > "$RUNNER_TEMP/bootstrap-attestation.json"
          node - "$RUNNER_TEMP/bootstrap-source-trust.json" "$GITHUB_REPOSITORY" "$default_branch" "$BOOTSTRAP_COMMIT" <<'NODE'
          const fs=require("fs"),[out,repository,branch,sha]=process.argv.slice(2);fs.writeFileSync(out,JSON.stringify({repository,workflowIdentity:`${repository}/.github/workflows/bootstrap.yml`,workflowRef:`refs/heads/${branch}`,workflowSha:sha})+"\n");
          NODE
          node infra/bootstrap/verify-attestation-identity.mjs "$RUNNER_TEMP/bootstrap-attestation.json" "$RUNNER_TEMP/bootstrap-source-trust.json" bootstrap/bootstrap.tgz
          for spec in "$INSTALLER_URL|install-bootstrap" "$INSTALLER_SIGNATURE_URL|install-bootstrap.sig";do url=${spec%|*};out=${spec#*|};node -e 'const u=new URL(process.argv[1]);if(u.protocol!=="https:"||u.username||u.password||u.port||!process.env.INSTALLER_ALLOWED_HOSTS.split(",").includes(u.hostname))process.exit(1)' "$url";curl --fail --proto '=https' --tlsv1.3 --max-redirs 0 -o "$RUNNER_TEMP/$out" "$url";done
          test "$(sha256sum "$RUNNER_TEMP/install-bootstrap"|awk '{print $1}')" = "$INSTALLER_SHA256"
          printf '%s\n' "$INSTALLER_ALLOWED_SIGNERS" > "$RUNNER_TEMP/installer-allowed";ssh-keygen -Y verify -q -f "$RUNNER_TEMP/installer-allowed" -I installer -n steam-top-bootstrap-installer -s "$RUNNER_TEMP/install-bootstrap.sig" < "$RUNNER_TEMP/install-bootstrap"
