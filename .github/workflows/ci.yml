  release-images:
    if: github.event_name != 'workflow_call' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [quality, production-security]
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: Authenticate only for immutable GHCR publication
        shell: bash
        run: printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Build and publish application images with provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/steam-top"
          docker buildx build --provenance=mode=max --sbom=true --push --metadata-file release/server.json --tag "$repository/server:${GITHUB_SHA}" --build-arg NODE_IMAGE_REPOSITORY --build-arg NODE_IMAGE_DIGEST -f Dockerfile.server .
          docker buildx build --provenance=mode=max --sbom=true --push --metadata-file release/web.json --tag "$repository/web:${GITHUB_SHA}" --build-arg NODE_IMAGE_REPOSITORY --build-arg NODE_IMAGE_DIGEST --build-arg CADDY_IMAGE_REPOSITORY --build-arg CADDY_IMAGE_DIGEST -f Dockerfile.web .
          docker buildx build --provenance=mode=max --sbom=true --push --metadata-file release/database.json --tag "$repository/database:${GITHUB_SHA}" --build-arg POSTGRES_IMAGE_REPOSITORY --build-arg POSTGRES_IMAGE_DIGEST -f Dockerfile.db .
          node scripts/create-release-manifest.mjs "$GITHUB_SHA" "$repository" release/server.json release/web.json release/database.json release/release-manifest.json
          node scripts/create-runtime-files-manifest.mjs . release/runtime-files.sha256
          node scripts/stage-runtime-files.mjs . release/runtime-files.sha256 release/runtime
          ./scripts/portable-sha256.sh manifest release server.json web.json database.json release-manifest.json runtime-files.sha256 > release/SHA256SUMS
      - name: Attest the release authorization manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/release-manifest.json
      - name: Attest the exact root runtime file manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/runtime-files.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
  release-host-core-integration:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-host-integration
    concurrency: { group: production-deployment-status-authority, cancel-in-progress: false }
    permissions: { contents: read, actions: read, deployments: write, packages: read, id-token: write, attestations: write }
    env:
      RELEASE_COMMIT: "${{ inputs.candidate_commit }}"
      RELEASE_RUN_ID: "${{ inputs.candidate_run_id }}"
      RELEASE_REF: "${{ inputs.candidate_ref }}"
      BOOTSTRAP_RUN_ID: "${{ vars.BOOTSTRAP_RUN_ID }}"
      BOOTSTRAP_ARCHIVE_SHA256: "${{ vars.BOOTSTRAP_ARCHIVE_SHA256 }}"
      DEPLOYMENT_PURPOSE: release-integration
      PUBLIC_ORIGIN: https://steam-top.integration.test:18443
      POSTGRES_DB: steam_top
      POSTGRES_USER: steam_top
      POSTGRES_PASSWORD: integration-postgres-password
      DATABASE_URL: postgresql://steam_top:integration-postgres-password@db:5432/steam_top?sslmode=require
      COOKIE_SIGNING_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      ADMIN_USERNAME: admin
      ADMIN_INITIAL_PASSWORD: integration-admin-password
      ADMIN_CSRF_SECRET: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI
      WEBCLIP_SIGNING_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM
      WEBCLIP_EXCHANGE_KEY: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ
      ANALYTICS_CURSOR_SECRET: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU
      ICLASS_API_BEARER_TOKEN: integration-unused
      ICLASS_MODE: guest-only-explicit
      POSTGRES_TLS_CERT_PATH: /opt/steam-top/.release-integration/tls/server.crt
      POSTGRES_TLS_KEY_PATH: /opt/steam-top/.release-integration/tls/server.key
    steps:
      - name: Require a disposable GitHub-hosted runner
        env: { RUNNER_KIND: "${{ runner.environment }}" }
        run: test "$RUNNER_KIND" = github-hosted
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "release-manifest-${{ inputs.candidate_commit }}", run-id: "${{ inputs.candidate_run_id }}", github-token: "${{ github.token }}", path: candidate }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: "production-bootstrap-${{ vars.BOOTSTRAP_COMMIT }}"
          run-id: "${{ vars.BOOTSTRAP_RUN_ID }}"
          github-token: "${{ github.token }}"
          path: bootstrap
      - name: Validate candidate and create default-branch authorization
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          manifest_sha=$(./scripts/portable-sha256.sh digest candidate/release-manifest.json);nonce=$(openssl rand -hex 32)
          test "$(node -p 'require("./candidate/release-manifest.json").commit')" = "$RELEASE_COMMIT"
          gh attestation verify candidate/release-manifest.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          gh attestation verify candidate/runtime-files.sha256 --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=release-host-integration&per_page=1" --jq 'if length==0 then "none" else (.[0].id|tostring)+"|"+.[0].payload.manifestSha256 end')
          DEPLOYMENT_PURPOSE=release-integration node scripts/create-pending-deployment.mjs candidate/release-manifest.json "$RELEASE_RUN_ID" "release-manifest-$RELEASE_COMMIT" "$manifest_sha" "$RELEASE_COMMIT" "$nonce" integration "$GITHUB_REPOSITORY/.github/workflows/authorize-release.yml" "$GITHUB_SHA" "$GITHUB_REF" workflow_run "$latest" pending.json
          deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input pending.json --jq .id)
          node scripts/create-bootstrap-authorization.mjs pending.json candidate/release-manifest.json candidate/runtime-files.sha256 candidate/release-manifest.json "$GITHUB_REPOSITORY" integration "$GITHUB_REPOSITORY/.github/workflows/authorize-release.yml" "$deployment_id" deployment-authorization.json
          printf 'INTEGRATION_DEPLOYMENT_ID=%s\nINTEGRATION_NONCE=%s\nINTEGRATION_MANIFEST_SHA=%s\nINTEGRATION_PREVIOUS=%s\n' "$deployment_id" "$nonce" "$manifest_sha" "$latest" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: deployment-authorization.json }
      - name: Verify and install the protected default-branch bootstrap
        env:
          GH_TOKEN: "${{ github.token }}"
          BOOTSTRAP_ALLOWED_SIGNERS: "${{ secrets.BOOTSTRAP_ALLOWED_SIGNERS }}"
          BOOTSTRAP_COMMIT: "${{ vars.BOOTSTRAP_COMMIT }}"
          VALIDATOR_URL: "${{ vars.VALIDATOR_URL }}"
          VALIDATOR_SIGNATURE_URL: "${{ vars.VALIDATOR_SIGNATURE_URL }}"
          VALIDATOR_SHA256: "${{ vars.VALIDATOR_SHA256 }}"
          INSTALLER_URL: "${{ vars.INSTALLER_URL }}"
          INSTALLER_SIGNATURE_URL: "${{ vars.INSTALLER_SIGNATURE_URL }}"
          INSTALLER_SHA256: "${{ vars.INSTALLER_SHA256 }}"
          INSTALLER_ALLOWED_HOSTS: "${{ vars.INSTALLER_ALLOWED_HOSTS }}"
          INSTALLER_ALLOWED_SIGNERS: "${{ secrets.INSTALLER_ALLOWED_SIGNERS }}"
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          default_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$default_branch" --jq .commit.sha)
          ancestry=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_COMMIT...$default_sha" --jq .status)
          [[ "$ancestry" == ahead || "$ancestry" == identical ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOOTSTRAP_RUN_ID" > "$RUNNER_TEMP/bootstrap-run.json"
          node scripts/verify-bootstrap-source-run.mjs "$RUNNER_TEMP/bootstrap-run.json" "$BOOTSTRAP_RUN_ID" "$BOOTSTRAP_COMMIT" "$default_branch"
          mkdir -p candidate/verification-evidence
          gh attestation verify deployment-authorization.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/authorize-release.yml" --format json > candidate/verification-evidence/authorization-attestation.json
          node - "$RUNNER_TEMP/authorization-source-trust.json" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" <<'NODE'
          const fs=require("fs"),[out,repository,workflowSha,workflowRef]=process.argv.slice(2);fs.writeFileSync(out,JSON.stringify({repository,workflowIdentity:`${repository}/.github/workflows/authorize-release.yml`,workflowRef,workflowSha})+"\n");
          NODE
          node infra/bootstrap/verify-attestation-identity.mjs candidate/verification-evidence/authorization-attestation.json "$RUNNER_TEMP/authorization-source-trust.json" deployment-authorization.json
          [[ "$INSTALLER_URL" == https://* && "$INSTALLER_SIGNATURE_URL" == https://* && "$INSTALLER_SHA256" =~ ^[a-f0-9]{64}$ && "$INSTALLER_ALLOWED_HOSTS" =~ ^[A-Za-z0-9.,-]+$ ]]
          node -e 'for(const raw of [process.env.INSTALLER_URL,process.env.INSTALLER_SIGNATURE_URL]){const u=new URL(raw);if(u.protocol!=="https:"||u.username||u.password||u.port||!process.env.INSTALLER_ALLOWED_HOSTS.split(",").includes(u.hostname))process.exit(1)}'
          curl --fail --proto '=https' --tlsv1.3 --max-redirs 0 --output "$RUNNER_TEMP/install-bootstrap" "$INSTALLER_URL"
          curl --fail --proto '=https' --tlsv1.3 --max-redirs 0 --output "$RUNNER_TEMP/install-bootstrap.sig" "$INSTALLER_SIGNATURE_URL"
          test "$(sha256sum "$RUNNER_TEMP/install-bootstrap" | awk '{print $1}')" = "$INSTALLER_SHA256"
          printf '%s\n' "$INSTALLER_ALLOWED_SIGNERS" > "$RUNNER_TEMP/installer-allowed-signers"
          ssh-keygen -Y verify -q -f "$RUNNER_TEMP/installer-allowed-signers" -I installer -n steam-top-bootstrap-installer -s "$RUNNER_TEMP/install-bootstrap.sig" < "$RUNNER_TEMP/install-bootstrap"
          for spec in "$VALIDATOR_URL|validate-bootstrap-tar.py" "$VALIDATOR_SIGNATURE_URL|validate-bootstrap-tar.py.sig";do url=${spec%|*};out=${spec#*|};node -e 'const u=new URL(process.argv[1]);if(u.protocol!=="https:"||u.username||u.password||u.port||!process.env.INSTALLER_ALLOWED_HOSTS.split(",").includes(u.hostname))process.exit(1)' "$url";curl --fail --proto '=https' --tlsv1.3 --max-redirs 0 -o "$RUNNER_TEMP/$out" "$url";done
          test "$(sha256sum "$RUNNER_TEMP/validate-bootstrap-tar.py"|awk '{print $1}')" = "$VALIDATOR_SHA256";ssh-keygen -Y verify -q -f "$RUNNER_TEMP/installer-allowed-signers" -I validator -n steam-top-bootstrap-validator -s "$RUNNER_TEMP/validate-bootstrap-tar.py.sig" < "$RUNNER_TEMP/validate-bootstrap-tar.py"
          sudo install -o root -g root -m 0555 "$RUNNER_TEMP/install-bootstrap" /usr/local/sbin/install-steam-top-bootstrap
          sudo install -d -o root -g root -m 0555 /usr/local/libexec;sudo install -o root -g root -m 0444 "$RUNNER_TEMP/validate-bootstrap-tar.py" /usr/local/libexec/steam-top-validate-bootstrap-tar.py
          test "$(sha256sum bootstrap/bootstrap.tgz | awk '{print $1}')" = "$BOOTSTRAP_ARCHIVE_SHA256"
          gh attestation verify bootstrap/bootstrap.tgz --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/bootstrap.yml" --format json > candidate/verification-evidence/bootstrap-attestation.json
          node - "$RUNNER_TEMP/bootstrap-source-trust.json" "$GITHUB_REPOSITORY" "$BOOTSTRAP_COMMIT" "$default_branch" <<'NODE'
          const fs=require("fs"),[out,repository,workflowSha,branch]=process.argv.slice(2);fs.writeFileSync(out,JSON.stringify({repository,workflowIdentity:`${repository}/.github/workflows/bootstrap.yml`,workflowRef:`refs/heads/${branch}`,workflowSha})+"\n");
          NODE
          node infra/bootstrap/verify-attestation-identity.mjs candidate/verification-evidence/bootstrap-attestation.json "$RUNNER_TEMP/bootstrap-source-trust.json" bootstrap/bootstrap.tgz
          printf '%s\n' "$BOOTSTRAP_ALLOWED_SIGNERS" > "$RUNNER_TEMP/bootstrap-allowed-signers"
          tar -xOf bootstrap/bootstrap.tgz bootstrap-files.sha256 > "$RUNNER_TEMP/bootstrap-files.sha256"
          bootstrap_manifest_sha=$(sha256sum "$RUNNER_TEMP/bootstrap-files.sha256" | awk '{print $1}')
          node - "$RUNNER_TEMP/bootstrap-trust.json" "$bootstrap_manifest_sha" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" <<'NODE'
          const fs=require("fs"),[out,digest,repo,commit,ref]=process.argv.slice(2);fs.writeFileSync(out,JSON.stringify({schemaVersion:1,purpose:"steam-top-bootstrap-trust",bootstrapSha256:digest,repository:repo,workflowIdentity:`${repo}/.github/workflows/authorize-release.yml`,workflowRef:ref,workflowSha:commit,deploymentPurpose:"release-integration",installer:{url:process.env.INSTALLER_URL,signatureUrl:process.env.INSTALLER_SIGNATURE_URL,sha256:process.env.INSTALLER_SHA256,allowedHosts:process.env.INSTALLER_ALLOWED_HOSTS.split(","),signerId:"installer",namespace:"steam-top-bootstrap-installer"},validator:{url:process.env.VALIDATOR_URL,signatureUrl:process.env.VALIDATOR_SIGNATURE_URL,sha256:process.env.VALIDATOR_SHA256,allowedHosts:process.env.INSTALLER_ALLOWED_HOSTS.split(","),signerId:"validator",namespace:"steam-top-bootstrap-validator"},githubTokenFile:"/opt/steam-top/.release-integration/secrets/github-token",authorizationDir:"/opt/steam-top/.release-integration/authorization",productionEnvFile:"/opt/steam-top/.release-integration/production.env",hostReceiptSigningKey:"/opt/steam-top/.release-integration/secrets/host-signing",hostReceiptAllowedSigners:"/opt/steam-top/.release-integration/secrets/host-allowed-signers",hostReceiptSignerId:"host-ci",ledgerSigningKey:"/opt/steam-top/.release-integration/secrets/ledger-signing",ledgerAllowedSigners:"/opt/steam-top/.release-integration/secrets/ledger-allowed-signers",ledgerSignerId:"ledger-ci",evidenceSigningKey:"/opt/steam-top/.release-integration/secrets/evidence-signing",productionStateDir:"/opt/steam-top/.release-integration/state",productionStateSigningKey:"/opt/steam-top/.release-integration/secrets/state-signing",productionStateAllowedSigners:"/opt/steam-top/.release-integration/secrets/state-allowed-signers",productionStateSignerId:"state-ci",adminSmokeSecretFile:"/opt/steam-top/.release-integration/secrets/admin-smoke.json",hostReceiptOutbox:"/opt/steam-top/.release-integration/outbox",pgServiceFile:"/opt/steam-top/.release-integration/secrets/pg-service",pgPassFile:"/opt/steam-top/.release-integration/secrets/pg-pass",pgServiceName:"target",cutoverPgService:"target",cutoverPgServiceFile:"/opt/steam-top/.release-integration/secrets/pg-service",cutoverPgPassFile:"/opt/steam-top/.release-integration/secrets/pg-pass",cutoverIncidentDir:"/opt/steam-top/.release-integration/cutover-incidents"})+"\n",{mode:0o600});
          NODE
          node - "$RUNNER_TEMP/bootstrap-trust.json" <<'NODE'
          const fs=require("fs"),path=process.argv[2],x=require(path);x.evidenceAllowedSigners="/opt/steam-top/.release-integration/secrets/evidence-allowed-signers";x.evidenceSignerId="evidence-ci";fs.writeFileSync(path,JSON.stringify(x)+"\n",{mode:0o600});
          NODE
          sudo install -d -o root -g root -m 0700 /run/steam-top-bootstrap-release
          sudo install -o root -g root -m 0444 "$RUNNER_TEMP/bootstrap-allowed-signers" /run/steam-top-bootstrap-release/allowed
          sudo install -o root -g root -m 0400 "$RUNNER_TEMP/bootstrap-trust.json" /run/steam-top-bootstrap-release/trust.json
          sudo env BOOTSTRAP_TAR_VALIDATOR=/usr/local/libexec/steam-top-validate-bootstrap-tar.py BOOTSTRAP_TAR_VALIDATOR_SHA256="$VALIDATOR_SHA256" EXPECTED_BOOTSTRAP_ARCHIVE_SHA256="$BOOTSTRAP_ARCHIVE_SHA256" BOOTSTRAP_ALLOWED_SIGNERS_FILE=/run/steam-top-bootstrap-release/allowed /usr/local/sbin/install-steam-top-bootstrap bootstrap/bootstrap.tgz bootstrap/bootstrap.tgz.sig bootstrap /run/steam-top-bootstrap-release/trust.json --no-systemd-for-integration
          sudo /opt/steam-top-bootstrap/invoke-production-policy-signer.py --verify-install
          sudo "$GITHUB_WORKSPACE/scripts/verify-and-create-production-policy-entry.sh" --verify-install
          sudo rm -rf /run/steam-top-bootstrap-release
      - name: Verify externally attested root runtime manifest
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh attestation verify candidate/runtime-files.sha256 --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
      - name: Authenticate to GHCR for immutable candidate pulls
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Install root canonical integration host and private inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o root -g root -m 0700 /opt/steam-top/.release-integration/{authorization,outbox,tls,secrets}
          sudo install -o root -g root -m 0600 /dev/null /var/lock/steam-top-release-integration.lock
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=db -addext subjectAltName=DNS:db -keyout server.key -out server.crt
          sudo install -o root -g root -m 0600 server.key /opt/steam-top/.release-integration/tls/server.key
          sudo install -o root -g root -m 0600 server.crt /opt/steam-top/.release-integration/tls/server.crt
          printf '%s' "$GITHUB_TOKEN" | sudo tee /opt/steam-top/.release-integration/secrets/github-token >/dev/null
          printf '{"username":"admin","password":"integration-admin-password"}\n' | sudo tee /opt/steam-top/.release-integration/secrets/admin-smoke.json >/dev/null
          printf '[target]\nhost=db\nhostaddr=127.0.0.1\nport=15432\ndbname=steam_top\nuser=steam_top\nsslmode=verify-full\nsslrootcert=/opt/steam-top/.release-integration/tls/server.crt\n' | sudo tee /opt/steam-top/.release-integration/secrets/pg-service >/dev/null
          printf 'db:15432:steam_top:steam_top:integration-postgres-password\n' | sudo tee /opt/steam-top/.release-integration/secrets/pg-pass >/dev/null
          sudo chmod 0600 /opt/steam-top/.release-integration/secrets/*
          sudo ssh-keygen -q -t ed25519 -N '' -f /opt/steam-top/.release-integration/secrets/host-signing
          sudo ssh-keygen -q -t ed25519 -N '' -f /opt/steam-top/.release-integration/secrets/ledger-signing
          sudo ssh-keygen -q -t ed25519 -N '' -f /opt/steam-top/.release-integration/secrets/evidence-signing
          sudo ssh-keygen -q -t ed25519 -N '' -f /opt/steam-top/.release-integration/secrets/state-signing
          sudo chmod 0400 /opt/steam-top/.release-integration/secrets/{host-signing,ledger-signing,evidence-signing,state-signing}
          printf 'host-ci %s\n' "$(sudo ssh-keygen -y -f /opt/steam-top/.release-integration/secrets/host-signing)" | sudo tee /opt/steam-top/.release-integration/secrets/host-allowed-signers >/dev/null
          printf 'ledger-ci %s\n' "$(sudo ssh-keygen -y -f /opt/steam-top/.release-integration/secrets/ledger-signing)" | sudo tee /opt/steam-top/.release-integration/secrets/ledger-allowed-signers >/dev/null
          printf 'evidence-ci %s\n' "$(sudo ssh-keygen -y -f /opt/steam-top/.release-integration/secrets/evidence-signing)" | sudo tee /opt/steam-top/.release-integration/secrets/evidence-allowed-signers >/dev/null
          printf 'state-ci %s\n' "$(sudo ssh-keygen -y -f /opt/steam-top/.release-integration/secrets/state-signing)" | sudo tee /opt/steam-top/.release-integration/secrets/state-allowed-signers >/dev/null
          sudo chmod 0444 /opt/steam-top/.release-integration/secrets/{host-allowed-signers,ledger-allowed-signers,evidence-allowed-signers,state-allowed-signers}
          sudo /opt/steam-top-bootstrap/prepare-release.sh "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/deployment-authorization.json" "$GITHUB_WORKSPACE/pending.json" /opt/steam-top/.release-integration/secrets/github-token /opt/steam-top/.release-integration/authorization
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - name: Build canonical environment and seed isolated local CA
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),m=require('./candidate/release-manifest.json');for(const [k,v] of Object.entries({SERVER_IMAGE:m.images.server,WEB_IMAGE:m.images.web,DATABASE_IMAGE:m.images.database,CADDY_IMAGE_REPOSITORY:process.env.CADDY_IMAGE_REPOSITORY,CADDY_IMAGE_DIGEST:process.env.CADDY_IMAGE_DIGEST}))fs.appendFileSync('/tmp/integration-images.env',`${k}=${v}\n`)
          NODE
          set -a;source /tmp/integration-images.env;set +a
          env | grep -E '^(PUBLIC_ORIGIN|SERVER_IMAGE|WEB_IMAGE|DATABASE_IMAGE|CADDY_IMAGE_REPOSITORY|CADDY_IMAGE_DIGEST|POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD|DATABASE_URL|COOKIE_SIGNING_KEY|ADMIN_USERNAME|ADMIN_INITIAL_PASSWORD|ADMIN_CSRF_SECRET|WEBCLIP_SIGNING_KEY|WEBCLIP_EXCHANGE_KEY|ANALYTICS_CURSOR_SECRET|ICLASS_API_BEARER_TOKEN|ICLASS_MODE|POSTGRES_TLS_CERT_PATH|POSTGRES_TLS_KEY_PATH)=' | sudo tee /opt/steam-top/.release-integration/production.env >/dev/null
          sudo chmod 0600 /opt/steam-top/.release-integration/production.env
          runtime=$(readlink -f /opt/steam-top/release-integration-current)
          sudo docker compose -p steam-top-release-integration --project-directory "$runtime" --env-file /opt/steam-top/.release-integration/production.env -f "$runtime/compose.yaml" -f "$runtime/compose.release-integration.yaml" up -d --wait
          sudo docker compose -p steam-top-release-integration --project-directory "$runtime" --env-file /opt/steam-top/.release-integration/production.env -f "$runtime/compose.yaml" -f "$runtime/compose.release-integration.yaml" cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/integration-root.crt
          sudo cp /tmp/integration-root.crt /usr/local/share/ca-certificates/steam-top-integration.crt
          sudo update-ca-certificates
          sudo docker compose -p steam-top-release-integration --project-directory "$runtime" --env-file /opt/steam-top/.release-integration/production.env -f "$runtime/compose.yaml" -f "$runtime/compose.release-integration.yaml exec -T db psql -U steam_top -d steam_top -c "set steam_top.configure_restore_target='RESTORE_NONPRODUCTION_DATA';update restore_control.deployment_environment set environment='production',restore_allowed=false,restore_target_id='00000000-0000-4000-8000-000000000099' where singleton"
          sudo docker compose -p steam-top-release-integration --project-directory "$runtime" --env-file /opt/steam-top/.release-integration/production.env -f "$runtime/compose.yaml" -f "$runtime/compose.release-integration.yaml exec -T db psql -U steam_top -d steam_top -v ON_ERROR_STOP=1 -c "create table if not exists restore_control.deployment_probe(nonce text primary key check(nonce~'^[a-f0-9]{64}$'),restore_target_id uuid not null,system_identifier text not null,created_at timestamptz not null default clock_timestamp(),consumed_at timestamptz,state text not null default 'pending',observed_at timestamptz,receipt_signed_at timestamptz);create role steam_top_app login password 'integration-app-password';grant connect on database steam_top to steam_top_app;grant usage on schema public,restore_control to steam_top_app;grant select,insert,update,delete on all tables in schema public to steam_top_app;grant usage,select,update on all sequences in schema public to steam_top_app;grant select,update on restore_control.deployment_probe to steam_top_app"
          sudo sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://steam_top_app:integration-app-password@db:5432/steam_top?sslmode=require|' /opt/steam-top/.release-integration/production.env
          sudo docker compose -p steam-top-release-integration --project-directory "$runtime" --env-file /opt/steam-top/.release-integration/production.env -f "$runtime/compose.yaml" -f "$runtime/compose.release-integration.yaml down
      - name: Authorize and invoke the complete host core as non-root
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home steam-top-integration
          sudoers_expected=${INTEGRATION_PREVIOUS//|/\\|}
          printf 'steam-top-integration ALL=(root) NOPASSWD: /opt/steam-top-bootstrap/deploy-release.sh --prepared-authorization %s %s %s %s %s %s %s %s %s\n' "/opt/steam-top/.release-integration/authorization/$INTEGRATION_NONCE.json" "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/deployment-authorization.json" "$GITHUB_WORKSPACE/pending.json" "$INTEGRATION_MANIFEST_SHA" "$GITHUB_REPOSITORY" "$RELEASE_COMMIT" "$INTEGRATION_NONCE" "$sudoers_expected|$INTEGRATION_DEPLOYMENT_ID" | sudo tee /etc/sudoers.d/steam-top-integration >/dev/null
          sudo chmod 0440 /etc/sudoers.d/steam-top-integration;sudo visudo -cf /etc/sudoers.d/steam-top-integration
          sudo -u steam-top-integration sudo /opt/steam-top-bootstrap/deploy-release.sh --prepared-authorization "/opt/steam-top/.release-integration/authorization/$INTEGRATION_NONCE.json" "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/deployment-authorization.json" "$GITHUB_WORKSPACE/pending.json" "$INTEGRATION_MANIFEST_SHA" "$GITHUB_REPOSITORY" "$RELEASE_COMMIT" "$INTEGRATION_NONCE" "$INTEGRATION_PREVIOUS|$INTEGRATION_DEPLOYMENT_ID" > receipt.frame
          node scripts/parse-host-receipt-frame.mjs receipt.frame "$INTEGRATION_NONCE" receipt.json receipt.sig
          node -e 'const r=require("./receipt.json");if(r.schemaVersion!==4||r.purpose!=="release-integration"||r.smoke?.complete!==true)process.exit(1)'
          test -f "/opt/steam-top/.release-integration/authorization/$INTEGRATION_NONCE.json.consumed"
      - name: Activate the actual host receipt and complete canonical integration cutover
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          TEST_DATABASE_URL: postgresql://steam_top:integration-postgres-password@127.0.0.1:15432/steam_top
          CANONICAL_EXISTING_DATABASE: steam_top
          CANONICAL_APP_ROLE: steam_top_app
          CANONICAL_PUBLIC_ORIGIN: https://steam-top.integration.test:18443
          SMOKE_INTEGRATION_MODE: "true"
        run: |
          set -euo pipefail
          sudo /opt/steam-top-bootstrap/reconcile-cutover-pending.sh
          receipt_generation=$(readlink -f "/opt/steam-top/.release-integration/outbox/receipts/$INTEGRATION_NONCE/current")
          test -f "$receipt_generation/payload.json" -a -f "$receipt_generation/payload.json.sig"
          runtime_sha=$(node -p 'require("./deployment-authorization.json").runtimeManifestSha256')
          sudo /opt/steam-top-bootstrap/activate-production-state.sh "$GITHUB_WORKSPACE/deployment-authorization.json" > activation.frame
          target=$(node -p 'require(process.argv[1]).database.restoreTargetId' "$receipt_generation/payload.json")
          runtime=/opt/steam-top/releases/$runtime_sha
          CANONICAL_CUTOVER_HOOK="$runtime/infra/backup/test-host-core-cutover-hook.sh" CANONICAL_STATE_NONCE="$INTEGRATION_NONCE" CANONICAL_HOST_RECEIPT_FILE="$receipt_generation/payload.json" CANONICAL_RESTORE_TARGET_ID="$target" CANONICAL_DEPLOYMENT_MANIFEST_SHA="$INTEGRATION_MANIFEST_SHA" RUNTIME_INSTALL_MANIFEST_SHA256="$runtime_sha" "$runtime/infra/backup/test-promotion-full.sh"
          test "$(node -p 'require(process.argv[1]).purpose' "$receipt_generation/payload.json")" = release-integration
          test "$(psql "$TEST_DATABASE_URL" -Atqc "select state from restore_control.finalize_outbox where nonce='$(printf 3%.0s {1..64})'")" = verified
          test "$(psql "$TEST_DATABASE_URL" -Atqc "select has_table_privilege('steam_top_app','restore_control.deployment_probe','select,update')")" = t
          test "$(psql "$TEST_DATABASE_URL" -Atqc "select has_table_privilege('steam_top_app','restore_control.promotion_audit','select')")" = f
          sudo /opt/steam-top-bootstrap/reconcile-cutover-pending.sh
      - name: Mark the release approved only after canonical cutover
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          printf '{"state":"success","environment":"release-host-integration","description":"isolated host core and full smoke passed"}\n' > integration-success.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$INTEGRATION_DEPLOYMENT_ID/statuses" --input integration-success.json
          printf '{"schemaVersion":1,"purpose":"approved-release","commit":"%s","manifestSha256":"%s","integrationDeploymentId":"%s"}\n' "$RELEASE_COMMIT" "$INTEGRATION_MANIFEST_SHA" "$INTEGRATION_DEPLOYMENT_ID" > candidate/APPROVED-RELEASE.json
      - name: Abort any provisional cutover after a failed public smoke
        id: cutover-recovery
        if: always()
        shell: bash
        env:
          TEST_DATABASE_URL: postgresql://steam_top:integration-postgres-password@127.0.0.1:15432/steam_top
        run: |
          set -euo pipefail
          echo 'recovery_verified=false' >> "$GITHUB_OUTPUT"
          cutover_nonce=$(printf '3%.0s' {1..64});pending="/opt/steam-top/.release-integration/cutover/$cutover_nonce"
          state=$(psql "$TEST_DATABASE_URL" -Atqc "select state from restore_control.finalize_outbox where nonce='$cutover_nonce'")
          if [[ $state == connect-granted-pending-smoke || $state == smoke-observed ]];then
            sudo env PROMOTE_PGSERVICE=target PGSERVICEFILE=/opt/steam-top/.release-integration/secrets/pg-service PGPASSFILE=/opt/steam-top/.release-integration/secrets/pg-pass CUTOVER_ALLOWED_SIGNERS_FILE="$pending/cutover-signers" CUTOVER_SIGNER_ID=cutover@test PROMOTE_STATE_DIR="$pending" /opt/steam-top-bootstrap/abort-cutover-current.sh "$INTEGRATION_NONCE" "$cutover_nonce" "$pending/promotion-ready" "$pending/preflight.json" "$pending/preflight.json.sig"
            post=$(psql "$TEST_DATABASE_URL" -Atqc "select state||'|'||(not has_database_privilege(app_role,current_database(),'connect'))||'|'||(not exists(select 1 from pg_stat_activity where datname=current_database() and usename=app_role)) from restore_control.finalize_outbox where nonce='$cutover_nonce'")
            if [[ $post != aborted\|t\|t ]];then sudo touch /opt/steam-top/.release-integration/recovery-preserve;exit 1;fi
          elif [[ -n $state && $state != verified && $state != aborted ]];then
            sudo touch /opt/steam-top/.release-integration/recovery-preserve;exit 1
          fi
          echo 'recovery_verified=true' >> "$GITHUB_OUTPUT"
      - name: Collect cutover recovery evidence
        if: always() && !success()
        shell: bash
        run: |
          mkdir -p recovery-evidence
          sudo find /opt/steam-top/.release-integration/cutover -type f \( -name 'CUTOVER-ABORTED.*' -o -name 'preflight.json' -o -name 'promotion-ready' \) -exec cp {} recovery-evidence/ \; 2>/dev/null || true
          sudo chown -R "$USER" recovery-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && !success()
        with: { name: "cutover-recovery-${{ inputs.candidate_commit }}-${{ github.run_id }}", path: recovery-evidence/, if-no-files-found: warn, retention-days: 90 }
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: candidate/APPROVED-RELEASE.json }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "approved-release-${{ inputs.candidate_commit }}", path: candidate/, if-no-files-found: error, retention-days: 90 }
      - if: always() && !success() && env.INTEGRATION_DEPLOYMENT_ID != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: printf '{"state":"failure","environment":"release-host-integration","description":"isolated host core integration failed"}\n' | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$INTEGRATION_DEPLOYMENT_ID/statuses" --input -
      - if: always()
        shell: bash
        env:
          RECOVERY_VERIFIED: "${{ steps.cutover-recovery.outputs.recovery_verified }}"
          PRIOR_SUCCESS: "${{ success() }}"
        run: |
          set +e
          failures=""
          if [[ "$PRIOR_SUCCESS" != true && "$RECOVERY_VERIFIED" != true ]];then sudo touch /opt/steam-top/.release-integration/recovery-preserve;fi
          runtime=$(readlink -f /opt/steam-top/release-integration-current 2>/dev/null);if [[ -n $runtime && ! -f /opt/steam-top/.release-integration/recovery-preserve ]];then sudo docker compose -p steam-top-release-integration --project-directory "$runtime" --env-file /opt/steam-top/.release-integration/production.env -f "$runtime/compose.yaml" -f "$runtime/compose.release-integration.yaml" down -v --remove-orphans || failures="$failures compose";elif [[ -f /opt/steam-top/.release-integration/recovery-preserve ]];then failures="$failures recovery-preserved";fi
          docker logout ghcr.io || failures="$failures registry-logout"
          sudo rm -f /etc/sudoers.d/steam-top-integration /usr/local/share/ca-certificates/steam-top-integration.crt /usr/local/sbin/install-steam-top-bootstrap /usr/local/libexec/steam-top-validate-bootstrap-tar.py /tmp/integration-root.crt /tmp/integration-images.env server.key server.crt || failures="$failures secrets"
          sudo update-ca-certificates || failures="$failures ca-trust"
          sudo userdel steam-top-integration || failures="$failures deploy-user"
          if [[ ! -f /opt/steam-top/.release-integration/recovery-preserve ]];then sudo rm -rf /opt/steam-top /opt/steam-top-bootstrap /etc/steam-top-bootstrap || failures="$failures integration-root";fi
          if [[ -n "$failures" ]];then echo "cleanup failures:$failures" >&2;exit 1;fi
