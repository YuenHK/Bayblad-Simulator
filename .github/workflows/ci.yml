name: CI quality and release gates

on:
  push:
  pull_request:

env:
  NODE_VERSION: 24.13.0
  PNPM_VERSION: 11.19.0

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.13-bookworm
        env:
          POSTGRES_USER: steam_top_test
          POSTGRES_PASSWORD: steam_top_test
          POSTGRES_DB: steam_top_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steam_top_test -d steam_top_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://steam_top_test:steam_top_test@127.0.0.1:5432/steam_top_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @steam-top/db test:postgres
      - run: pnpm --filter @steam-top/server test:postgres
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  production-security:
    runs-on: ubuntu-24.04
    needs: quality
    env:
      PUBLIC_ORIGIN: https://localhost
      SECURITY_HTTP_ORIGIN: http://localhost
      SECURITY_HTTPS_ORIGIN: https://localhost
      SECURITY_TLS_INSECURE: "true"
      DEPLOYMENT_VERSION: ci
      POSTGRES_DB: steam_top
      POSTGRES_USER: steam_top
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_URL: postgresql://steam_top:ci-postgres-password@db:5432/steam_top?sslmode=require
      COOKIE_SIGNING_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      ADMIN_USERNAME: admin
      ADMIN_INITIAL_PASSWORD: fwft2026
      ADMIN_CSRF_SECRET: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI
      WEBCLIP_SIGNING_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM
      WEBCLIP_EXCHANGE_KEY: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ
      ANALYTICS_CURSOR_SECRET: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU
      ICLASS_API_BEARER_TOKEN: ci-not-used
      ICLASS_MODE: guest-only-explicit
      POSTGRES_TLS_CERT_PATH: .ci/tls/server.crt
      POSTGRES_TLS_KEY_PATH: .ci/tls/server.key
      NODE_IMAGE_REPOSITORY: node
      POSTGRES_IMAGE_REPOSITORY: postgres
      CADDY_IMAGE_REPOSITORY: caddy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Resolve immutable base-image digests
        shell: bash
        run: |
          set -euo pipefail
          for item in NODE=node:24.13.0-bookworm-slim POSTGRES=postgres:16.13-bookworm CADDY=caddy:2.10.2-alpine; do
            key="${item%%=*}"; image="${item#*=}"
            docker pull "$image"
            digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
            test -n "$digest"
            printf '%s_IMAGE_DIGEST=%s\n' "$key" "$digest" >> "$GITHUB_ENV"
          done
      - name: Create ephemeral PostgreSQL TLS material
        run: |
          mkdir -p .ci/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=db -addext subjectAltName=DNS:db -keyout .ci/tls/server.key -out .ci/tls/server.crt
          chmod 600 .ci/tls/server.key
      - run: pnpm validate:caddy
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: pnpm test:security
      - if: always()
        run: docker compose down -v
