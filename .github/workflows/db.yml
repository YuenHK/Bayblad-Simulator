name: PostgreSQL schema

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-contract:
    name: PostgreSQL functional integration (not production bootstrap evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
        env:
          POSTGRES_USER: steam_top_test
          POSTGRES_PASSWORD: steam_top_test
          POSTGRES_DB: steam_top_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steam_top_test -d steam_top_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-wrong-cluster:
        image: postgres@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
        env:
          POSTGRES_USER: steam_top_test
          POSTGRES_PASSWORD: steam_top_test
          POSTGRES_DB: steam_top_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U steam_top_test -d steam_top_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://steam_top_test:steam_top_test@127.0.0.1:5432/steam_top_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y age openssh-client shellcheck postgresql-client
      - run: shellcheck scripts/deploy-production.sh && pnpm --filter @steam-top/db test
      - run: pnpm --filter @steam-top/db test:postgres
      - run: pnpm --filter @steam-top/server test:postgres
      - run: ./infra/backup/test-cutover-migration.sh
      - run: ./infra/backup/test-platform-installation.sh
      - run: pnpm build
      - run: sha256sum -c infra/backup/trusted-ledger-cli.sha256
      - name: Install a root-owned functional fixture (not a production trust root)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/create-runtime-files-manifest.mjs . "$RUNNER_TEMP/runtime-files.sha256"
          runtime_sha=$(./scripts/portable-sha256.sh digest "$RUNNER_TEMP/runtime-files.sha256")
          for root in /opt/steam-top "/opt/steam-top/releases/$runtime_sha"; do
            sudo install -d -o root -g root -m 0755 "$root"
            while read -r _ mode path; do
              sudo install -D -o root -g root -m "$mode" "$path" "$root/$path"
            done < "$RUNNER_TEMP/runtime-files.sha256"
            sudo install -o root -g root -m 0444 "$RUNNER_TEMP/runtime-files.sha256" "$root/runtime-files.sha256"
            node - "$root" "$runtime_sha" "$GITHUB_SHA" "$RUNNER_TEMP/runtime-receipt.json" <<'NODE'
          const fs=require("fs"),[installRoot,runtimeManifestSha256,commit,out]=process.argv.slice(2);fs.writeFileSync(out,JSON.stringify({schemaVersion:1,purpose:"steam-top-runtime-install",installRoot,runtimeManifestSha256,commit,sealedAt:new Date().toISOString()})+"\n",{mode:0o444});
          NODE
            sudo install -o root -g root -m 0444 "$RUNNER_TEMP/runtime-receipt.json" "$root/runtime-install-receipt.json"
            sudo find "$root" -type d -exec chown root:root {} +
            sudo find "$root" -type d -exec chmod 0555 {} +
            sudo env RUNTIME_INSTALL_MANIFEST_SHA256="$runtime_sha" "$root/scripts/verify-runtime-install.sh" "$root"
          done
          echo "RUNTIME_INSTALL_MANIFEST_SHA256=$runtime_sha" >> "$GITHUB_ENV"
      - name: Install the signed packaged bootstrap functional fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo ./infra/bootstrap/test-installer-archive-safety.sh ./infra/bootstrap/install-bootstrap.sh
          archive="$RUNNER_TEMP/bootstrap.tar.gz"
          ./infra/bootstrap/create-package.sh infra/bootstrap "$archive"
          mkdir "$RUNNER_TEMP/bootstrap-unpack"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bootstrap-unpack"
          bootstrap_sha=$(./scripts/portable-sha256.sh digest "$RUNNER_TEMP/bootstrap-unpack/bootstrap-files.sha256")
          archive_sha=$(./scripts/portable-sha256.sh digest "$archive")
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/bootstrap-source"
          ssh-keygen -Y sign -q -f "$RUNNER_TEMP/bootstrap-source" -n steam-top-bootstrap-source "$archive"
          printf 'bootstrap-ci %s\n' "$(cat "$RUNNER_TEMP/bootstrap-source.pub")" > "$RUNNER_TEMP/bootstrap-allowed"
          node - "$RUNNER_TEMP/bootstrap-trust.json" "$bootstrap_sha" "$GITHUB_REPOSITORY" "$GITHUB_SHA" <<'NODE'
          const fs=require("fs"),[out,bootstrapSha256,repository,workflowSha]=process.argv.slice(2);fs.writeFileSync(out,JSON.stringify({schemaVersion:1,purpose:"steam-top-bootstrap-trust",bootstrapSha256,repository,workflowIdentity:`${repository}/.github/workflows/db.yml`,workflowRef:"refs/heads/main",workflowSha,deploymentPurpose:"production",cutoverPgService:"cutover-ci",cutoverPgServiceFile:"/run/steam-top-ci/pg_service.conf",cutoverPgPassFile:"/run/steam-top-ci/pgpass",cutoverIncidentDir:"/run/steam-top-ci/incidents",githubTokenFile:"/run/steam-top-ci/github-token",hostReceiptOutbox:"/run/steam-top-ci/outbox",hostReceiptAllowedSigners:"/run/steam-top-ci/host-allowed",hostReceiptSignerId:"host-ci",ledgerAllowedSigners:"/run/steam-top-ci/ledger-allowed",ledgerSignerId:"ledger-ci",productionStateDir:"/run/steam-top-ci/state",productionStateSigningKey:"/run/steam-top-ci/state-key",productionStateAllowedSigners:"/run/steam-top-ci/state-allowed",productionStateSignerId:"state-ci",legacyCutoverAllowedSigners:"/run/steam-top-ci/legacy-allowed",legacyCutoverSignerId:"legacy-ci"})+"\n",{mode:0o600});
          NODE
          sudo install -d -o root -g root -m 0700 /run/steam-top-bootstrap-db
          sudo install -d -o root -g root -m 0700 /run/steam-top-ci /run/steam-top-ci/incidents
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/state-key"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/legacy-key"
          printf 'state-ci %s\n' "$(cat "$RUNNER_TEMP/state-key.pub")" > "$RUNNER_TEMP/state-allowed"
          sudo install -o root -g root -m 0400 "$RUNNER_TEMP/state-key" /run/steam-top-ci/state-key
          sudo install -o root -g root -m 0444 "$RUNNER_TEMP/state-allowed" /run/steam-top-ci/state-allowed
          printf 'legacy-ci %s\n' "$(cat "$RUNNER_TEMP/legacy-key.pub")" > "$RUNNER_TEMP/legacy-allowed"
          sudo install -o root -g root -m 0400 "$RUNNER_TEMP/legacy-key" /run/steam-top-ci/legacy-key
          sudo install -o root -g root -m 0444 "$RUNNER_TEMP/legacy-allowed" /run/steam-top-ci/legacy-allowed
          printf '[cutover-ci]\nhost=127.0.0.1\nport=5432\ndbname=steam_top_test\nuser=steam_top_test\nsslmode=disable\n' | sudo tee /run/steam-top-ci/pg_service.conf >/dev/null
          printf '127.0.0.1:5432:steam_top_test:steam_top_test:steam_top_test\n' | sudo tee /run/steam-top-ci/pgpass >/dev/null
          sudo chown root:root /run/steam-top-ci/pg_service.conf /run/steam-top-ci/pgpass
          sudo chmod 0400 /run/steam-top-ci/pg_service.conf /run/steam-top-ci/pgpass
          sudo install -o root -g root -m 0444 "$RUNNER_TEMP/bootstrap-allowed" /run/steam-top-bootstrap-db/allowed
          sudo install -o root -g root -m 0400 "$RUNNER_TEMP/bootstrap-trust.json" /run/steam-top-bootstrap-db/trust.json
          validator_sha=$(sha256sum infra/bootstrap/validate-bootstrap-tar.py|awk '{print $1}');sudo install -o root -g root -m 0444 infra/bootstrap/validate-bootstrap-tar.py /run/steam-top-bootstrap-db/validate-bootstrap-tar.py;validator=/run/steam-top-bootstrap-db/validate-bootstrap-tar.py
          sudo env BOOTSTRAP_TAR_VALIDATOR="$validator" BOOTSTRAP_TAR_VALIDATOR_SHA256="$validator_sha" EXPECTED_BOOTSTRAP_ARCHIVE_SHA256="$archive_sha" BOOTSTRAP_ALLOWED_SIGNERS_FILE=/run/steam-top-bootstrap-db/allowed ./infra/bootstrap/install-bootstrap.sh "$archive" "$archive.sig" bootstrap-ci /run/steam-top-bootstrap-db/trust.json --install-systemd --initialize-first-deploy "$(printf %064d 27)"
          sudo env CI=true BOOTSTRAP_TAR_VALIDATOR="$validator" BOOTSTRAP_TAR_VALIDATOR_SHA256="$validator_sha" EXPECTED_BOOTSTRAP_ARCHIVE_SHA256="$archive_sha" BOOTSTRAP_ALLOWED_SIGNERS_FILE=/run/steam-top-bootstrap-db/allowed ./infra/bootstrap/test-ceremony-installer-recovery.sh ./infra/bootstrap/install-bootstrap.sh "$archive" "$archive.sig" bootstrap-ci /run/steam-top-bootstrap-db/trust.json --install-systemd --initialize-first-deploy "$(printf %064d 27)"
          sudo /opt/steam-top-bootstrap/invoke-production-policy-signer.py --verify-install
          sudo "$GITHUB_WORKSPACE/scripts/verify-and-create-production-policy-entry.sh" --verify-install
          sudo ln -sfn "/opt/steam-top/releases/$runtime_sha" /opt/steam-top/current
          sudo rm -rf /run/steam-top-bootstrap-db
      - name: Exercise signed first-deploy authority and inherited host lock
        shell: bash
        run: |
          set -euo pipefail
          nonce=$(printf %064d 27)
          sudo /opt/steam-top-bootstrap/read-install-receipt.sh >/dev/null
          sudo /opt/steam-top-bootstrap/read-first-deploy-state.sh | grep -q "^pending $nonce "
          # This is the lock topology used by host-deploy-and-receipt ->
          # deploy-production -> advance-first-deploy-state. It must not
          # deadlock by opening the already-held production lock again.
          sudo env NONCE="$nonce" bash -c 'exec 9<>/var/lock/steam-top-production.lock; flock 9; timeout 5 /opt/steam-top-bootstrap/advance-first-deploy-state.sh pending "$NONCE"'
          receipt=$(sudo find /var/lib/steam-top-bootstrap/install-receipts -mindepth 1 -maxdepth 1 -type d)
          sudo cp -a "$receipt" "${receipt}-duplicate"
          if sudo /opt/steam-top-bootstrap/read-install-receipt.sh; then
            echo "duplicate canonical install receipt was accepted" >&2
            exit 1
          fi
          sudo rm -rf "${receipt}-duplicate"
          sudo /opt/steam-top-bootstrap/read-install-receipt.sh >/dev/null
      - name: Verify the production reaper service definitions
        run: systemd-analyze verify infra/systemd/steam-top-cutover-reaper.service infra/systemd/steam-top-cutover-reaper.timer
      - run: sudo chown root:root "$GITHUB_WORKSPACE" && sudo chown -R root:root infra/backup apps/server/dist && sudo find infra/backup apps/server/dist -type d -exec chmod go-w {} + && sudo chmod 0555 apps/server/dist/admin/deletion-ledger-cli.js && sudo chmod 0444 infra/backup/trusted-ledger-cli.sha256
      - run: CI=true ./infra/backup/test-backup-restore.sh
      - run: ./infra/backup/test-promotion-isolation.sh
      - run: /opt/steam-top/infra/backup/test-canonical-cutover-full.sh
      - name: Exercise packaged generation collision and runtime-tree fail-closed behavior
        run: sudo /opt/steam-top/scripts/test-deployment-atomicity.sh
