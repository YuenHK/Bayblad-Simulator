name: steam-top-simulator

x-service-hardening: &service-hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  pids_limit: 256

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:?POSTGRES_IMAGE immutable digest is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-steam_top}
      POSTGRES_USER: ${POSTGRES_USER:-steam_top}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, postgres_tls_cert, postgres_tls_key]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /run/postgresql:size=16m,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1G }
        reservations: { memory: 256M }

  migration:
    <<: *service-hardening
    image: steam-top-server:${DEPLOYMENT_VERSION:-local}
    restart: "no"
    command: [node, migrate-entry.mjs]
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      DEPLOYMENT_MARKER_FILE: /var/lib/steam-top-state/restore-target-id
    secrets: [database_url]
    volumes: ["deployment_marker:/var/lib/steam-top-state"]
    tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
    networks: [database]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }
        reservations: { memory: 128M }

  server:
    <<: *service-hardening
    image: steam-top-server:${DEPLOYMENT_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        NODE_IMAGE: ${NODE_IMAGE:?NODE_IMAGE immutable digest is required}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      DATABASE_TLS: ${DATABASE_TLS:-require}
      DATABASE_URL_FILE: /run/secrets/database_url
      COOKIE_SIGNING_KEY_FILE: /run/secrets/cookie_signing_key
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD_FILE: /run/secrets/admin_initial_password
      ADMIN_CSRF_SECRET_FILE: /run/secrets/admin_csrf_secret
      ADMIN_CSRF_KEY_ID: ${ADMIN_CSRF_KEY_ID:-primary}
      WEBCLIP_SIGNING_KEY_FILE: /run/secrets/webclip_signing_key
      WEBCLIP_EXCHANGE_KEY_FILE: /run/secrets/webclip_exchange_key
      WEBCLIP_AUDIENCE: ${WEBCLIP_AUDIENCE:-steam-top}
      ANALYTICS_CURSOR_SECRET_FILE: /run/secrets/analytics_cursor_secret
      ICLASS_MODE: ${ICLASS_MODE:-guest-only-explicit}
      ICLASS_API_URL: ${ICLASS_API_URL:-}
      ICLASS_API_BEARER_TOKEN_FILE: /run/secrets/iclass_api_bearer_token
      ICLASS_API_TIMEOUT_MS: ${ICLASS_API_TIMEOUT_MS:-3000}
      ICLASS_API_MAX_ATTEMPTS: ${ICLASS_API_MAX_ATTEMPTS:-2}
      ICLASS_DEVICE_MAP_CSV_PATH: /app/config/iclass-device-map.csv
      DELETION_LEDGER_FILE: ${DELETION_LEDGER_FILE:-/var/lib/steam-top/deletion-ledger.log}
      DELETION_SOURCE_INSTANCE_ID_FILE: /var/lib/steam-top-state/restore-target-id
    secrets:
      - database_url
      - cookie_signing_key
      - admin_initial_password
      - admin_csrf_secret
      - webclip_signing_key
      - webclip_exchange_key
      - analytics_cursor_secret
      - iclass_api_bearer_token
    volumes:
      - "deletion_ledger:/var/lib/steam-top"
      - "deployment_marker:/var/lib/steam-top-state:ro"
      - "${ICLASS_DEVICE_MAP_PATH:-./config/iclass-device-map.csv}:/app/config/iclass-device-map.csv:ro"
    tmpfs: ["/tmp:size=1g,noexec,nosuid,nodev"]
    networks: [backend, database]
    depends_on:
      migration: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 1536M }
        reservations: { memory: 384M }

  web:
    <<: *service-hardening
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NODE_IMAGE: ${NODE_IMAGE:?NODE_IMAGE immutable digest is required}
        CADDY_IMAGE: ${CADDY_IMAGE:?CADDY_IMAGE immutable digest is required}
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /config:size=16m,nosuid,nodev
      - /data:size=16m,nosuid,nodev
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }
        reservations: { memory: 32M }

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE immutable digest is required}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 128
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
    networks: [edge, backend]
    depends_on:
      server: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { memory: 64M }

volumes:
  postgres_data:
  deletion_ledger:
  deployment_marker:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
  database:
    internal: true

secrets:
  postgres_password: { environment: POSTGRES_PASSWORD }
  postgres_tls_cert: { file: "${POSTGRES_TLS_CERT_PATH:?POSTGRES_TLS_CERT_PATH is required}" }
  postgres_tls_key: { file: "${POSTGRES_TLS_KEY_PATH:?POSTGRES_TLS_KEY_PATH is required}" }
  database_url: { environment: DATABASE_URL }
  cookie_signing_key: { environment: COOKIE_SIGNING_KEY }
  admin_initial_password: { environment: ADMIN_INITIAL_PASSWORD }
  admin_csrf_secret: { environment: ADMIN_CSRF_SECRET }
  webclip_signing_key: { environment: WEBCLIP_SIGNING_KEY }
  webclip_exchange_key: { environment: WEBCLIP_EXCHANGE_KEY }
  analytics_cursor_secret: { environment: ANALYTICS_CURSOR_SECRET }
  iclass_api_bearer_token: { environment: ICLASS_API_BEARER_TOKEN }
