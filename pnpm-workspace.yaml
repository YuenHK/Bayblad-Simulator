packages:
  - apps/*
  - packages/*
# tsx and Vitest require esbuild's exact-version postinstall under this supply policy.
allowBuilds:
  esbuild: true
minimumReleaseAge: 1440
# @testing-library/react@16.3.3 於 2026-08-27 發布；超過 24 小時後移除此例外。
minimumReleaseAgeExclude:
  - '@testing-library/react@16.3.3'
